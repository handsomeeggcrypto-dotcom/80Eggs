<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="station.webmanifest">
<link rel="icon" href="faces/good.png">
<title>YOLK Station</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* Written for Chrome on Android 5 (2015-era): no CSS variables in JS, no grid gaps tricks */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0806; }
  body {
    color: #f2eadb; font: 28px/1.25 "VT323", ui-monospace, Menlo, monospace;
    background-image: repeating-linear-gradient(0deg, transparent 0, transparent 2px, #100d09 2px, #100d09 4px);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .hidden { display: none !important; }   /* beats #ambient's display:flex */

  /* ---- ambient ---- */
  #ambient { display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }
  .left { -webkit-flex: 1; flex: 1; padding: 36px 40px; display: -webkit-flex; display: flex;
          -webkit-flex-direction: column; flex-direction: column; }
  .right { width: 46%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
           -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #clock { font-size: 150px; line-height: .9; color: #ffc21a; letter-spacing: .02em; }
  #date { font-size: 36px; color: #f2eadb; margin-top: 6px; }
  #weather { font-size: 34px; color: #f2eadb; margin-top: 22px; }
  #weather .dim, .dim { color: #8a6410; }
  #streak { font-size: 30px; color: #ffc21a; margin-top: 14px; min-height: 1.2em; }
  .moe { margin-top: auto; display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; }
  .moe img { width: 130px; border: 3px solid #ffc21a; margin-right: 18px; background: #16120c; }
  .moe .label { font-size: 22px; color: #8a6410; }
  .moe .name { font-size: 32px; }
  .tier { display: inline-block; padding: 0 8px; color: #0a0806; font-size: 24px; }
  /* faces/big/* are already 240px; shown at exactly that size so old Chrome never blurs them */
  #bigface { width: 240px; height: 240px; }
  #idle { margin-top: 18px; font-size: 30px; color: #8a6410; text-align: center; max-width: 90%; min-height: 2.5em; }
  .tap { font-size: 22px; color: #3a2c0c; margin-top: 10px; }

  /* ---- talk ---- */
  #talk { padding: 30px 40px; box-sizing: border-box; }
  .stage { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
  #talkface { width: 240px; height: 240px; margin-right: 34px; }
  #bubble { -webkit-flex: 1; flex: 1; min-height: 180px; padding: 16px 22px; font-size: 36px;
            background: #16120c; border: 3px solid #ffc21a; }
  #choices { margin-top: 28px; }
  #choices button { display: block; width: 100%; text-align: left; font: inherit; font-size: 34px;
                    color: #f2eadb; background: transparent; border: 0; padding: 12px 16px; margin-bottom: 4px; }
  #choices button:active, #choices button.hot { background: #ffc21a; color: #0a0806; }
  #choices button:before { content: "> "; color: #8a6410; }

  /* ---- dead channel ---- */
  #dead { background: #000; }
  #static { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: .85; }
  #deadmoe { position: absolute; width: 260px; left: 50%; top: 50%; margin: -150px 0 0 -130px; opacity: 0; }
  #deadtext { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 56px;
              color: #fff; text-shadow: 4px 0 #ff3d6e, -4px 0 #3df5ff; letter-spacing: .08em; }
  #deadface { position: absolute; right: 40px; top: 40px; width: 120px; height: 120px;
              -webkit-filter: drop-shadow(5px 0 0 #ff3d6e); filter: drop-shadow(5px 0 0 #ff3d6e); }

  /* ---- meditation ---- */
  #med { background: #000; text-align: center; }
  .medbtn { display: inline-block; font: inherit; font-size: 30px; color: #0a0806; background: #ffc21a;
            border: 0; padding: 10px 26px; margin-top: 16px; }
  #medpick h2 { font-weight: normal; color: #ffc21a; font-size: 44px; margin: 60px 0 10px; }
  #medpick .dim { font-size: 26px; }
  .mins { margin: 30px 0 10px; }
  .mins button { font: inherit; font-size: 48px; width: 130px; height: 110px; margin: 8px; color: #ffc21a;
                 background: #16120c; border: 3px solid #ffc21a; }
  .mins button:active { background: #ffc21a; color: #0a0806; }
  .mins button small { display: block; font-size: 22px; color: #8a6410; }
  #medsound, #halfway, #medcancel { font: inherit; font-size: 28px; color: #8a6410; background: transparent; border: 0; margin: 10px 18px; }
  #medrun { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #ring { position: absolute; left: 50%; top: 46%; border-radius: 50%;
          border: 3px solid #4a3810; background: rgba(255, 194, 26, .06); }
  #medface { position: absolute; left: 50%; top: 46%; width: 240px; height: 240px; margin: -120px 0 0 -120px; opacity: .85; }
  #breath { position: absolute; left: 0; right: 0; bottom: 120px; font-size: 44px; color: #8a6410; }
  #medleft { position: absolute; left: 0; right: 0; bottom: 60px; font-size: 26px; color: #3a2c0c; }
  #medask { position: absolute; left: 0; right: 0; bottom: 40px; }
  .ambbtn { font: inherit; font-size: 26px; color: #8a6410; background: transparent; border: 2px solid #3a2c0c;
            padding: 6px 22px; margin-top: 14px; }

  /* ---- YOLK's eye ---- */
  #eyebtn { position: absolute; right: 18px; top: 14px; font: inherit; font-size: 22px; color: #3a2c0c;
            background: transparent; border: 2px solid #2a2010; padding: 2px 12px; z-index: 5; }
  #eyebtn.on { color: #78dcff; border-color: #78dcff; }
  #eyebtn.needs { color: #ff3d6e; border-color: #ff3d6e; }
  #eyemeter { position: absolute; right: 18px; top: 50px; height: 4px; width: 0; background: #78dcff; z-index: 5;
              -webkit-transition: width .3s; transition: width .3s; }
  #away { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0;
          pointer-events: none; -webkit-transition: opacity 3s; transition: opacity 3s; }
  #eyehelp { position: absolute; left: 60px; right: 60px; top: 60px; bottom: 60px; padding: 24px 32px;
             background: #16120c; border: 3px solid #ff3d6e; font-size: 26px; z-index: 10; overflow: auto; }
  #eyehelp b { color: #ffc21a; font-weight: normal; }
  #eyehelp .addr { color: #78dcff; font-size: 30px; }
  #hint { position: absolute; left: 0; right: 0; top: 70px; font-size: 32px; color: #78dcff; opacity: 0;
          -webkit-transition: opacity 1s; transition: opacity 1s; }
  video#cam { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

  #offline { position: absolute; left: 0; right: 0; top: 0; padding: 6px; text-align: center; font-size: 22px;
             background: #3a0c14; color: #ff3d6e; }

  @media (orientation: portrait) {
    #ambient { -webkit-flex-direction: column-reverse; flex-direction: column-reverse; }
    .right { width: auto; padding-top: 30px; }
    #clock { font-size: 120px; }
  }
</style>
</head>
<body>
<div id="ambient" class="screen">
  <div class="left">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="weather"></div>
    <div id="streak"></div>
    <div class="moe" id="moe"></div>
  </div>
  <div class="right" id="yolkspot">
    <img id="bigface" src="faces/big/good.png" alt="YOLK">
    <div id="idle"></div>
    <div class="tap">tap YOLK to talk</div>
    <button class="ambbtn" id="medgo">meditate</button>
  </div>
</div>

<div id="talk" class="screen hidden">
  <div class="stage">
    <img id="talkface" src="faces/big/good.png" alt="YOLK">
    <div id="bubble"></div>
  </div>
  <div id="choices"></div>
</div>

<div id="dead" class="screen hidden">
  <canvas id="static" width="160" height="100"></canvas>
  <img id="deadmoe" alt="">
  <img id="deadface" src="faces/big/shock.png" alt="">
  <div id="deadtext"></div>
</div>

<div id="med" class="screen hidden">
  <div id="medpick">
    <h2>sit with YOLK</h2>
    <div class="dim">pick a length. YOLK breathes with you. a bell starts and ends it.</div>
    <div class="mins" id="mins"></div>
    <button id="medsound">sound: silence</button>
    <button id="halfway">halfway bell: off</button>
    <div class="dim" id="medsoundnote" style="font-size:22px;min-height:1.2em"></div>
    <button id="medcancel">never mind</button>
  </div>
  <div id="medrun" class="hidden">
    <div id="ring"></div>
    <img id="medface" src="faces/big/blink.png" alt="">
    <div id="breath"></div>
    <div id="medleft"></div>
    <div id="hint"></div>
    <div id="medask" class="hidden">
      <button class="medbtn" id="keepgoing">keep going</button>
      <button class="medbtn" id="endnow" style="background:#3a2c0c;color:#f2eadb">end session</button>
    </div>
  </div>
</div>

<div id="away"></div>
<button id="eyebtn">eye: off</button>
<div id="eyemeter"></div>
<div id="eyehelp" class="hidden"></div>
<video id="cam" autoplay muted playsinline></video>
<canvas id="eyecanvas" width="64" height="48" style="display:none"></canvas>

<div id="offline" class="hidden">YOLK's brain (the mac) isn't answering. is it awake?</div>

<script>
// Plain ES5 + XMLHttpRequest on purpose: this runs on a 2014 Galaxy Tab with Android 5.
var L = {}, mem = {}, amb = null, mode = "ambient";

function $(id) { return document.getElementById(id); }
function big(face) { return "faces/big/" + face + ".png"; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function fill(s) { return s.replace(/\{name\}/g, (mem.name && mem.name !== "nobody") ? mem.name : "you"); }

function get(url, cb) {
  var x = new XMLHttpRequest();
  x.open("GET", url);
  x.onload = function () {
    $("offline").className = "hidden";
    if (x.status === 403) { location.href = "/pair"; return; }
    try { cb(JSON.parse(x.responseText)); } catch (e) {}
  };
  x.onerror = function () { $("offline").className = ""; };
  x.send();
}
function post(url, body, cb) {
  var x = new XMLHttpRequest();
  x.open("POST", url);
  x.setRequestHeader("Content-Type", "application/json");
  x.onload = function () { try { cb && cb(JSON.parse(x.responseText)); } catch (e) {} };
  x.send(JSON.stringify(body));
}

// ------------------------------------------------------------ ambient
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
var TIER = { MYTHIC: "#ff3d6e", LEGENDARY: "#ffc21a", EPIC: "#be6eff", RARE: "#3df5ff", COMMON: "#96a0be" };

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function tick() {
  var d = new Date(), h = d.getHours();
  $("clock").textContent = (h % 12 || 12) + ":" + pad(d.getMinutes());
  $("date").textContent = DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
}

function moodFace() {
  var h = new Date().getHours();
  return h < 5 ? "tired" : h < 8 ? "ok" : "good";
}

function drawAmbient() {
  if (!amb) return;
  var w = amb.weather;
  $("weather").innerHTML = w ? (w.hi + "&deg; / " + w.lo + "&deg; " + w.sky +
    (w.rain >= 30 ? " &middot; " + w.rain + "% rain" : "") + ' <span class="dim">' + w.place + "</span>") : "";
  var parts = [];
  if (amb.meditation && amb.meditation.streak) parts.push("meditation: " + amb.meditation.streak + " day" + (amb.meditation.streak > 1 ? "s" : "") + (amb.meditation.today ? " (done today)" : ""));
  if (amb.streak) parts.push(amb.streak.habit + ": " + amb.streak.days + " days");
  $("streak").textContent = parts.join("  .  ");
  var m = amb.moe;
  if (m) {
    var t = m.traits[0];
    $("moe").innerHTML = '<img src="/moe/' + m.n + '.jpg" alt="">' +
      '<div><div class="label">MOE OF THE DAY</div><div class="name">#' + m.n + ' <span class="tier" style="background:' +
      TIER[m.tier] + '">' + m.tier + '</span></div><div class="dim">' + (t ? t.value.replace(" *", "") + " &middot; " + t.type : "") +
      "</div></div>";
  }
}

function refresh() {
  get("/api/ambient", function (d) { amb = d; drawAmbient(); });
  get("/api/state", function (s) { mem = s.memory || {}; });
}

// YOLK blinks and says idle things now and then
var blinkT = null;
function idleLife() {
  if (mode !== "ambient") return;
  var f = moodFace();
  $("bigface").src = big("blink");
  setTimeout(function () {
    if (mode !== "ambient") return;
    $("bigface").src = big(eye.on && Date.now() < eye.glanceUntil ? eye.glance : f);
  }, 140);
  if (Math.random() < 0.25 && L.station_idle) $("idle").textContent = fill(pick(L.station_idle));
  blinkT = setTimeout(idleLife, 2500 + Math.random() * 4000);
}

// ------------------------------------------------------------ voice
var audio = new Audio();
function speak(text, cb) {
  var done = false;
  function finish() { if (!done) { done = true; cb && cb(); } }
  audio.onended = finish;
  audio.onerror = finish;
  audio.src = "/api/say?t=" + encodeURIComponent(text);
  var p = audio.play();
  if (p && p.catch) p.catch(finish);
  // never get stuck if audio misbehaves: ~70ms per character, plus a second
  setTimeout(finish, 1500 + text.length * 90);
}

// ------------------------------------------------------------ talking
var typing = null, idleOut = null;
function show(id) {
  $("ambient").className = "screen" + (id === "ambient" ? "" : " hidden");
  $("talk").className = "screen" + (id === "talk" ? "" : " hidden");
  $("dead").className = "screen" + (id === "dead" ? "" : " hidden");
  $("med").className = "screen" + (id === "med" ? "" : " hidden");
  mode = id;
}

function say(text, face, cb) {
  text = fill(text);
  face = face || moodFace();
  var b = $("bubble"), i = 0, mouth = 0;
  clearInterval(typing);
  b.textContent = "";
  $("choices").innerHTML = "";
  typing = setInterval(function () {
    i++;
    b.textContent = text.slice(0, i);
    mouth = (mouth + 1) % 6;
    $("talkface").src = big(mouth < 3 ? "talk" : face);
    if (i >= text.length) { clearInterval(typing); $("talkface").src = big(face); }
  }, 32);
  speak(text, function () {
    clearInterval(typing);
    b.textContent = text;
    $("talkface").src = big(face);
    cb && cb();
  });
  resetIdle();
}

function choose(options, cb) {
  var box = $("choices");
  box.innerHTML = "";
  for (var i = 0; i < options.length; i++) {
    (function (i) {
      var btn = document.createElement("button");
      btn.textContent = fill(options[i]);
      btn.onclick = function () { btn.className = "hot"; box.innerHTML = ""; cb(i); };
      box.appendChild(btn);
    })(i);
  }
  resetIdle();
}

function lines(list, faces, cb) {   // say several lines in a row
  var i = 0;
  (function next() {
    if (i >= list.length) return cb && cb();
    var f = faces ? faces[i % faces.length] : null;
    say(list[i++], f, function () { setTimeout(next, 350); });
  })();
}

function resetIdle() {
  clearTimeout(idleOut);
  if (mode === "med") return;               // meditation has its own clock
  idleOut = setTimeout(sleepNow, 60000);   // a minute with no taps: back to ambient
}

function sleepNow() {
  clearTimeout(idleOut);
  clearInterval(med.timer);
  if (!bed.paused) bed.pause();
  audio.pause();
  micClose();
  show("ambient");
  idleLife();
}

var TOPICS = ["talk to me", "meditate", "how are you?", "what's today?", "ask the oracle", "tell me a secret", "how am i doing?", "go back to sleep"];
function menu() {
  say(pick(["what do you want to talk about?", "so.", "anything else?", "i'm listening."]), null, function () {
    choose(TOPICS, function (c) {
      var then = function () { setTimeout(menu, 300); };
      var t = TOPICS[c];
      if (t === "talk to me") converse(true);
      else if (t === "meditate") say(pick(["ok. let's sit.", "good idea. i'll breathe too. sort of."]), "blink", medPick);
      else if (t === "how are you?") howAreYou(then);
      else if (t === "what's today?") today(then);
      else if (t === "ask the oracle") oracle(then);
      else if (t === "tell me a secret") say(pick(L.secrets), pick(["sus", "ok", "shock"]), then);
      else if (t === "how am i doing?") progress(then);
      else say(pick(["going back to watching.", "ok. i'll be right here.", "sleep mode. not really. i never sleep."]), "ok",
               function () { setTimeout(sleepNow, 800); });
    });
  });
}

function howAreYou(cb) {
  var w = amb && amb.weather;
  var extra = w ? (w.hi >= 85 ? " it's hot out there. eggs cook at that temperature." :
                   w.lo <= 32 ? " it's freezing tonight. i'm glad i live indoors." : "") : "";
  say(pick(["good. i have a big screen now. it's a lot of me.", "fine. watching. waiting. you know.",
            "i'm an egg on a tablet. honestly? thriving."]) + extra, "good", cb);
}

function today(cb) {
  var text = amb && amb.daily;
  if (!text) return say("no briefing yet. plug SHELL into the mac and i'll make one.", "sus", cb);
  var ls = text.split("\n").filter(function (l) { return l.trim(); });
  lines(ls, ["good", "talk"], cb);
}

function oracle(cb) {
  say("think of a question. yes or no. hold it in your head. then tap spin.", "sus", function () {
    var spins = 0, faces = ["sus", "shock", "ok", "talk"];
    (function loop() {
      choose(["spin" + new Array((spins % 4) + 1).join("."), "ask now"], function (c) {
        if (c === 0) { spins++; $("talkface").src = big(faces[spins % 4]); loop(); }
        else say(pick(L.oracle), pick(["sus", "good", "shock", "ok"]), cb);
      });
    })();
  });
}

function progress(cb) {
  get("/api/stats", function (st) {
    if (!st.entries || !st.entries.length) return say("no check-ins yet. do one on SHELL, then plug it into the mac.", "sus", cb);
    var best = null;
    for (var h in st.streaks) if (!best || st.streaks[h] > st.streaks[best]) best = h;
    var s = "your mood's been averaging " + st.mood_avg + " out of 5.";
    if (best && st.streaks[best] > 1) s += " best streak: " + best + ", " + st.streaks[best] + " days.";
    say(s, st.mood_avg >= 3.5 ? "good" : "ok", cb);
  });
}

function wake() {
  // fullscreen on the first tap (needs a gesture)
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs && !document.fullscreenElement && !document.webkitFullscreenElement) { try { fs.call(el); } catch (e) {} }
  if (mode !== "ambient") return;
  clearTimeout(blinkT);
  show("talk");
  post("/api/memory", { station_visits: (parseInt(mem.station_visits || "0", 10) || 0) + 1 }, function (r) { if (r && r.memory) mem = r.memory; });
  var h = new Date().getHours();
  var hello = h >= 4 && h < 12 ? pick(["good morning, {name}. talk to me if you want.", "morning, {name}. i'm awake. obviously.",
                                       "good morning. tap talk to me and ask me anything."])
                               : pick(L.station_hello || ["oh. hi."]);
  say(hello, "good", function () { setTimeout(menu, 300); });
}

// ------------------------------------------------------------ talking out loud
// The mic records you, the Mac turns it into text (Whisper, on the Mac) and Claude
// answers as YOLK. Old Chrome has no MediaRecorder, so this builds a WAV by hand.
var mic = { stream: null, ctx: null, node: null };

function micOpen(ok, fail) {
  if (mic.stream) return ok();
  var md = navigator.mediaDevices;
  var got = function (stream) { mic.stream = stream; ok(); };
  if (md && md.getUserMedia) md.getUserMedia({ audio: true, video: false }).then(got, fail);
  else if (navigator.webkitGetUserMedia) navigator.webkitGetUserMedia({ audio: true, video: false }, got, fail);
  else fail({ message: "no mic access on this page" });
}

function micClose() {
  if (mic.node) { try { mic.node.disconnect(); } catch (e) {} mic.node = null; }
  if (mic.stream) {
    var tracks = mic.stream.getTracks ? mic.stream.getTracks() : [];
    for (var i = 0; i < tracks.length; i++) tracks[i].stop();
    mic.stream = null;
  }
}

// records until you stop talking (or tap "done"), then hands cb a 16kHz WAV Blob (null if silent)
function listen(cb) {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!mic.ctx) mic.ctx = new AC();
  if (mic.ctx.resume) mic.ctx.resume();
  var ctx = mic.ctx, src = ctx.createMediaStreamSource(mic.stream), node = ctx.createScriptProcessor(4096, 1, 1);
  var chunks = [], start = Date.now(), lastLoud = 0, floor = 1, heard = false, done = false;
  function stop() {
    if (done) return;
    done = true;
    node.disconnect(); src.disconnect(); mic.node = null;
    $("choices").innerHTML = "";
    cb(heard ? wav(chunks, ctx.sampleRate) : null);
  }
  node.onaudioprocess = function (e) {
    var d = e.inputBuffer.getChannelData(0), sum = 0;
    chunks.push(new Float32Array(d));
    for (var i = 0; i < d.length; i++) sum += d[i] * d[i];
    var rms = Math.sqrt(sum / d.length), now = Date.now();
    if (now - start < 400) { floor = Math.min(floor, rms); return; }      // learn the room's hum first
    var loud = rms > Math.max(0.015, floor * 3);
    if (loud) { heard = true; lastLoud = now; }
    $("talkface").src = big(loud ? "talk" : "good");
    if ((heard && now - lastLoud > 1400) || now - start > 20000 || (!heard && now - start > 8000)) stop();
  };
  src.connect(node);
  node.connect(ctx.destination);             // Chrome only runs the processor when it's connected
  mic.node = node;
  choose(["done talking"], stop);
}

function wav(chunks, rate) {
  var n = 0, i, j;
  for (i = 0; i < chunks.length; i++) n += chunks[i].length;
  var ratio = rate / 16000, out = new Int16Array(Math.floor(n / ratio)), all = new Float32Array(n), at = 0;
  for (i = 0; i < chunks.length; i++) { all.set(chunks[i], at); at += chunks[i].length; }
  for (i = 0; i < out.length; i++) {          // average down to 16kHz
    var a = Math.floor(i * ratio), b = Math.min(n, Math.floor((i + 1) * ratio)), sum = 0;
    for (j = a; j < b; j++) sum += all[j];
    var v = Math.max(-1, Math.min(1, sum / Math.max(1, b - a)));
    out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  var buf = new ArrayBuffer(44 + out.length * 2), dv = new DataView(buf);
  function str(o, s) { for (var k = 0; k < s.length; k++) dv.setUint8(o + k, s.charCodeAt(k)); }
  str(0, "RIFF"); dv.setUint32(4, 36 + out.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  str(36, "data"); dv.setUint32(40, out.length * 2, true);
  for (i = 0; i < out.length; i++) dv.setInt16(44 + i * 2, out[i], true);
  return new Blob([dv], { type: "audio/wav" });
}

function converse(first) {
  micOpen(function () {
    $("bubble").textContent = first ? "i'm listening. talk, then stop." : "go ahead.";
    listen(function (rec) {
      if (!rec) return say("i didn't hear anything. maybe next time.", "sus", function () { setTimeout(menu, 300); });
      $("bubble").textContent = "...";
      $("talkface").src = big("sus");
      var x = new XMLHttpRequest();
      x.open("POST", "/api/talk" + (first ? "?new=1" : ""));
      x.timeout = 60000;
      x.onload = function () {
        var r = {};
        try { r = JSON.parse(x.responseText); } catch (e) {}
        say(r.reply || "my brain glitched. try again.", "good", function () {
          choose(["say something else", "that's all"], function (c) { if (c === 0) converse(false); else menu(); });
        });
      };
      x.onerror = x.ontimeout = function () {
        say("the mac isn't answering. is it awake?", "sus", function () { setTimeout(menu, 300); });
      };
      x.send(rec);
      resetIdle();
    });
  }, function (err) {
    say("i can't hear you. the tablet won't let me use the mic.", "sus", function () {
      eyeHelp(err && err.name === "NotAllowedError" ? "mic permission was turned down." :
              (err && (err.name || err.message)) || "no mic access on this page.");
      setTimeout(menu, 300);
    });
  });
}

// ------------------------------------------------------------ meditation
var bell = new Audio("sounds/bell.wav");
var med = { halfway: false, timer: null, sound: 0 };
// files from tools/make_meditation_audio.py; binaural beats need stereo headphones
var SOUNDS = [
  { name: "silence" },
  { name: "theta 6Hz binaural", file: "01 Theta 6Hz binaural.m4a", phones: true },
  { name: "alpha 10Hz binaural", file: "02 Alpha 10Hz binaural.m4a", phones: true },
  { name: "delta 3Hz binaural", file: "03 Delta 3Hz binaural.m4a", phones: true },
  { name: "white noise", file: "04 White noise.m4a" },
  { name: "pink noise", file: "05 Pink noise.m4a" },
  { name: "brown noise", file: "06 Brown noise.m4a" }
];
var bed = new Audio();
bed.loop = true;

function soundLabel() {
  var snd = SOUNDS[med.sound];
  $("medsound").textContent = "sound: " + snd.name;
  $("medsoundnote").textContent = snd.phones ? "binaural beats only work with headphones" : "";
}
function bedStart() {
  var snd = SOUNDS[med.sound];
  if (!snd.file) return;
  bed.src = "sounds/med/" + encodeURIComponent(snd.file);
  bed.volume = 0.8;
  try { var p = bed.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
function bedStop() {
  // a short fade so it doesn't cut off abruptly
  var v = bed.volume;
  var f = setInterval(function () {
    v -= 0.08;
    if (v <= 0) { clearInterval(f); bed.pause(); bed.volume = 0.8; return; }
    try { bed.volume = v; } catch (e) { clearInterval(f); bed.pause(); }
  }, 120);
}
var BREATH_IN = 4000, BREATH_OUT = 6000;     // a slow, calming rhythm

function ring(size) {
  var r = $("ring");
  r.style.width = r.style.height = size + "px";
  r.style.marginLeft = r.style.marginTop = (-size / 2) + "px";
}

function ding() { try { bell.currentTime = 0; bell.play(); } catch (e) {} }

function medPick() {
  clearTimeout(blinkT);
  audio.pause();
  show("med");
  clearTimeout(idleOut);
  $("medpick").className = "";
  $("medrun").className = "hidden";
  var box = $("mins");
  box.innerHTML = "";
  [5, 10, 15, 20, 30].forEach(function (m) {
    var b = document.createElement("button");
    b.innerHTML = m + "<small>min</small>";
    b.onclick = function () { medStart(m); };
    box.appendChild(b);
  });
}
$("halfway").onclick = function () {
  med.halfway = !med.halfway;
  $("halfway").textContent = "halfway bell: " + (med.halfway ? "on" : "off");
};
$("medcancel").onclick = function () { sleepNow(); };
$("medsound").onclick = function () {
  med.sound = (med.sound + 1) % SOUNDS.length;
  soundLabel();
  try { localStorage.setItem("yolk_med_sound", med.sound); } catch (e) {}
};
try { med.sound = parseInt(localStorage.getItem("yolk_med_sound") || "0", 10) % SOUNDS.length || 0; } catch (e) {}
soundLabel();

function medStart(minutes) {
  $("medpick").className = "hidden";
  $("medrun").className = "";
  $("medask").className = "hidden";
  med.minutes = minutes;
  med.start = Date.now();
  med.end = med.start + minutes * 60000;
  med.rang = false;
  eye.fidget = 0; eye.fidgets = 0;
  $("medface").src = big("blink");
  ding();
  bedStart();
  clearInterval(med.timer);
  med.timer = setInterval(medTick, 60);
}

function medTick() {
  var now = Date.now();
  var cycle = BREATH_IN + BREATH_OUT;
  var p = (now - med.start) % cycle;
  var k, word;
  if (p < BREATH_IN) { k = p / BREATH_IN; word = "breathe in"; }
  else { k = 1 - (p - BREATH_IN) / BREATH_OUT; word = "breathe out"; }
  var ease = (1 - Math.cos(k * Math.PI)) / 2;          // smooth start and stop
  ring(300 + ease * 260);
  var b = $("breath");
  b.textContent = word;
  b.style.opacity = 0.35 + 0.65 * Math.sin(Math.min(1, (p < BREATH_IN ? p / BREATH_IN : (p - BREATH_IN) / BREATH_OUT)) * Math.PI);
  var left = Math.max(0, med.end - now);
  var s = Math.ceil(left / 1000);
  $("medleft").textContent = Math.floor(s / 60) + ":" + pad(s % 60);
  if (med.halfway && !med.rang && now - med.start >= (med.end - med.start) / 2) { med.rang = true; ding(); }
  if (left <= 0) medDone(med.minutes);
}

// tapping during a session asks before ending it
$("medrun").onclick = function (e) {
  if (e.target.tagName === "BUTTON") return;
  $("medask").className = $("medask").className ? "" : "hidden";
};
$("keepgoing").onclick = function () { $("medask").className = "hidden"; };
$("endnow").onclick = function () {
  medDone(Math.floor((Date.now() - med.start) / 60000), true);
};

function medDone(minutes, early) {
  clearInterval(med.timer);
  bedStop();
  ding();
  $("medask").className = "hidden";
  $("breath").textContent = "";
  $("medleft").textContent = "";
  ring(300);
  var finish = function (st) {
    show("talk");
    var line = early ? (minutes ? "that counts. " + minutes + " minute" + (minutes > 1 ? "s" : "") + " is " + minutes + " more than zero." :
                                  "that's ok. sitting down was the hard part.")
                     : pick(["welcome back.", "and... back.", "that was nice. i liked that."]) + " " + minutes + " minutes.";
    if (st && st.streak > 1) line += " that's " + st.streak + " days in a row.";
    if (eye.on && !early && minutes >= 5) line += eye.fidgets === 0 ? " you were very still. i was watching. respectfully." : "";
    setTimeout(function () {
      say(line, "blink", function () {
        choose(["sit again", "done"], function (c) { if (c === 0) medPick(); else sleepNow(); });
      });
    }, 2500);   // let the bell ring out first
  };
  if (minutes >= 1) post("/api/meditate", { minutes: minutes }, function (st) { refresh(); finish(st); });
  else finish(null);
}

$("medgo").onclick = function (e) { e.stopPropagation(); medPick(); };

// ------------------------------------------------------------ dead channel
var deadT = null;
function scheduleDead() {
  clearTimeout(deadT);
  deadT = setTimeout(function () { if (mode === "ambient") deadChannel(); scheduleDead(); },
                     (8 + Math.random() * 7) * 60000);   // every 8-15 minutes
}

function deadChannel() {
  show("dead");
  clearTimeout(blinkT);
  var c = $("static"), ctx = c.getContext("2d"), img = ctx.createImageData(c.width, c.height);
  var n = amb && amb.moe ? amb.moe.n : Math.floor(Math.random() * 5250) + 1;
  $("deadmoe").src = "/moe/" + (Math.floor(Math.random() * 5250) + 1) + ".jpg";
  $("deadtext").textContent = L.dead_channel ? pick(L.dead_channel) : "";
  var t0 = Date.now();
  var frame = setInterval(function () {
    var px = img.data;
    for (var i = 0; i < px.length; i += 4) {
      var v = Math.random() * 255 | 0;
      px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    var e = Date.now() - t0;
    $("deadmoe").style.opacity = (e > 1500 && e < 4500 && Math.random() > 0.3) ? 1 : 0;
    $("deadface").style.left = "";
    $("deadface").style.right = (40 + (Math.random() * 30 | 0)) + "px";
    if (e > 7000) { clearInterval(frame); show("ambient"); idleLife(); }
  }, 70);
}

// ------------------------------------------------------------ YOLK's eye
// Movement only. Twice a second the camera frame is shrunk to 64x48 grey
// pixels and compared with the previous one; the only thing kept is what
// percent of it changed. No picture is ever stored or sent anywhere.
var eye = { on: false, stream: null, prev: null, timer: null, lastMove: Date.now(), present: true,
            level: 0, fidget: 0, fidgets: 0, cx: 0.5, cy: 0.5, glance: null, glanceUntil: 0, noPic: 0 };
var GLANCE = 1.2;                 // % changing that's enough for YOLK to look over
var AWAY_AFTER = 10 * 60000;      // nobody moving for 10 minutes = away
var MOVE = 3;                     // % of the view changing that counts as movement
var BIG_MOVE = 10;                // % changing that counts as fidgeting during meditation
var PIXEL_CHANGE = 25;            // a pixel "changed" if it brightened/darkened by this much (camera grain is less)

function eyePref(v) {
  try { if (v === undefined) return localStorage.getItem("yolk_eye") === "on"; localStorage.setItem("yolk_eye", v ? "on" : "off"); }
  catch (e) { return false; }
}

function eyeLabel(state) {
  var b = $("eyebtn");
  b.className = state === "on" ? "on" : state === "needs" ? "needs" : "";
  b.textContent = state === "on" ? "eye: watching" : state === "needs" ? "eye: needs setup" : "eye: off";
}

function chromeVersion() {
  var m = navigator.userAgent.match(/Chrome\/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function eyeHelp(why) {
  var v = chromeVersion(), origin = location.protocol + "//" + location.host;
  var h = '<div style="color:#ff3d6e;font-size:32px">YOLK can\'t open the camera yet</div>' +
          '<div class="dim">' + why + "</div><br>";
  if (v && v < 62) {
    h += "your Chrome is version " + v + ", too old for the camera switch.<br><br>" +
         "<b>1.</b> open the <b>Play Store</b>, search <b>Chrome</b>, tap <b>Update</b>.<br>" +
         "<b>2.</b> then come back here and tap the eye again.";
  } else {
    h += "Chrome only lets pages use the camera on secure sites. one switch tells it to trust your mac:<br><br>" +
         "<b>1.</b> in Chrome's address bar, type <b>chrome://flags</b> and open it<br>" +
         "<b>2.</b> search for <b>insecure origins treated as secure</b><br>" +
         "<b>3.</b> in its box, type exactly:<br><span class=\"addr\">" + origin + "</span><br>" +
         "<b>4.</b> set it to <b>Enabled</b>, then tap <b>Relaunch</b><br>" +
         "<b>5.</b> come back here and tap the eye. when Chrome asks about the camera, tap <b>Allow</b>.";
  }
  h += '<br><br><button class="medbtn" id="eyehelpclose">ok</button>';
  $("eyehelp").innerHTML = h;
  $("eyehelp").className = "";
  $("eyehelpclose").onclick = function () { $("eyehelp").className = "hidden"; };
}

function eyeStart() {
  var md = navigator.mediaDevices;
  var constraints = { video: { facingMode: "user", width: 320, height: 240 }, audio: false };
  var ok = function (stream) {
    eye.stream = stream;
    var v = $("cam");
    if ("srcObject" in v) v.srcObject = stream; else v.src = URL.createObjectURL(stream);
    try { v.play(); } catch (e) {}
    eye.on = true; eye.prev = null; eye.lastMove = Date.now();
    eyePref(true);
    eyeLabel("on");
    clearInterval(eye.timer);
    eye.timer = setInterval(eyeLook, 500);
  };
  var fail = function (err) {
    eyePref(false);
    eyeLabel("needs");
    eyeHelp(err && err.name === "NotAllowedError" ? "camera permission was turned down." : (err && (err.name || err.message)) || "no camera access on this page.");
  };
  if (md && md.getUserMedia) md.getUserMedia(constraints).then(ok, fail);
  else if (navigator.webkitGetUserMedia) navigator.webkitGetUserMedia({ video: true, audio: false }, ok, fail);
  else fail({ message: "this page isn't allowed to ask for the camera (not a secure site)." });
}

function eyeStop() {
  clearInterval(eye.timer);
  if (eye.stream) {
    var tracks = eye.stream.getTracks ? eye.stream.getTracks() : [];
    for (var i = 0; i < tracks.length; i++) tracks[i].stop();
  }
  eye.stream = null; eye.on = false; eye.prev = null;
  $("eyemeter").style.width = "0";
  eyePref(false);
  eyeLabel("off");
  setAway(false);
}

function eyeLook() {
  var v = $("cam");
  if (!v.videoWidth) {
    // the camera is on but sending no picture: say so instead of silently doing nothing
    if (++eye.noPic === 6) { eyeLabel("needs"); $("eyebtn").textContent = "eye: no picture"; try { v.play(); } catch (e) {} }
    return;
  }
  if (eye.noPic >= 6) eyeLabel("on");
  eye.noPic = 0;
  var c = $("eyecanvas"), ctx = c.getContext("2d");
  ctx.drawImage(v, 0, 0, c.width, c.height);
  var px = ctx.getImageData(0, 0, c.width, c.height).data;
  var grey = new Array(c.width * c.height), changed = 0, sx = 0, sy = 0;
  for (var i = 0, j = 0; i < px.length; i += 4, j++) {
    grey[j] = (px[i] * 3 + px[i + 1] * 6 + px[i + 2]) / 10;
    if (eye.prev && Math.abs(grey[j] - eye.prev[j]) > PIXEL_CHANGE) {
      changed++;
      sx += j % c.width;
      sy += (j / c.width) | 0;
    }
  }
  var first = !eye.prev;
  eye.prev = grey;
  if (first) return;
  eye.level = changed * 100 / grey.length;
  if (changed) { eye.cx = sx / changed / c.width; eye.cy = sy / changed / c.height; }
  $("eyemeter").style.width = Math.min(120, eye.level * 8) + "px";
  if (eye.level > GLANCE && mode === "ambient") glanceAt(eye.cx, eye.cy);
  var now = Date.now();
  if (eye.level > MOVE) {
    if (!eye.present) arrived();
    eye.lastMove = now;
  } else if (eye.present && now - eye.lastMove > AWAY_AFTER && mode === "ambient") {
    leftRoom();
  }
  if (mode === "med" && $("medrun").className === "") stillness();
}

// look toward the movement. The front camera's picture isn't mirrored: when you
// move to your left you show up on the camera's right, so the sides swap.
function glanceAt(cx, cy) {
  var face = cx > 0.6 ? "lookl" : cx < 0.4 ? "lookr" : cy < 0.35 ? "lookup" : "good";
  eye.glance = face;
  eye.glanceUntil = Date.now() + 2500;
  if (eye.present) $("bigface").src = big(face);
}

function setAway(away) {
  eye.present = !away;
  $("away").style.opacity = away ? 0.75 : 0;
}

function leftRoom() {
  setAway(true);
  $("idle").textContent = "you left. i'll keep watching the door.";
}

function arrived() {
  setAway(false);
  if (mode !== "ambient") return;
  var line = pick(["oh. you're back.", "there you are.", "i saw you come in. obviously.", "welcome back, {name}."]);
  $("idle").textContent = fill(line);
  $("bigface").src = big("shock");
  setTimeout(function () { if (mode === "ambient") $("bigface").src = big("good"); }, 900);
  speak(fill(line));   // works once the page has been tapped since it loaded
}

// during meditation: notice sustained fidgeting, say nothing out loud
function stillness() {
  if (eye.level > BIG_MOVE) eye.fidget++;
  else eye.fidget = Math.max(0, eye.fidget - 1);
  if (eye.fidget >= 6) {             // ~3 seconds of big movement
    eye.fidget = 0;
    eye.fidgets++;
    var h = $("hint");
    h.textContent = pick(["you moved. it's ok. start your breath again.", "settle back in.", "find your breath again."]);
    h.style.opacity = 1;
    setTimeout(function () { h.style.opacity = 0; }, 4000);
  }
}

$("eyebtn").onclick = function (e) {
  e.stopPropagation();
  if (eye.on) eyeStop(); else eyeStart();
};

// ------------------------------------------------------------ go
$("yolkspot").onclick = wake;
$("bigface").onclick = wake;
document.addEventListener("click", resetIdle);
document.addEventListener("click", function () { eye.lastMove = Date.now(); if (!eye.present) setAway(false); });
get("/api/lines", function (d) { L = d; $("idle").textContent = fill(pick(L.station_idle || ["still here."])); });
refresh();
tick();
setInterval(tick, 1000);
setInterval(refresh, 10 * 60000);
idleLife();
scheduleDead();
if (eyePref()) eyeStart(); else eyeLabel("off");
if (location.hash === "#dead") setTimeout(deadChannel, 1500);   // for testing
</script>
