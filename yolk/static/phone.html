<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YOLK">
<meta name="theme-color" content="#0a0806">
<title>YOLK</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* YOLK on the iPhone: served at /p/<key>/ (yolk/server.py), home Wi-Fi only.
     "Add to Home Screen" from Safari's share menu makes it an app. */
  :root { --bg: #0a0806; --panel: #16120c; --yolk: #ffc21a; --dim: #8a6410; --ink: #f2eadb; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
               font: 17px/1.35 ui-monospace, Menlo, monospace; -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid #2a2010; }
  header img { width: 52px; height: 52px; image-rendering: pixelated; }
  header b { color: var(--yolk); letter-spacing: .12em; }
  header small { display: block; color: var(--dim); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .msg { max-width: 82%; padding: 9px 13px; margin: 0 0 10px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
  .her { background: var(--panel); border: 2px solid var(--yolk); }
  .you { background: var(--yolk); color: #0a0806; margin-left: auto; }
  .when { color: var(--dim); font-size: 12px; text-align: center; margin: 6px 0 10px; }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid #2a2010; background: var(--bg); }
  input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 4px;
          border: 2px solid var(--dim); background: var(--panel); color: var(--ink); }
  input:focus { outline: none; border-color: var(--yolk); }
  button { font: inherit; font-weight: bold; padding: 0 16px; border: 0; border-radius: 4px; background: var(--yolk); color: #0a0806; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <img id="face" src="face/good.png" alt="">
  <div><b>YOLK</b><small id="status">home wi-fi only</small></div>
</header>
<div id="log"></div>
<form id="f">
  <input id="t" placeholder="text yolk" autocomplete="off" enterkeyhint="send">
  <button id="go">send</button>
</form>
<script>
const $ = id => document.getElementById(id);
const KEEP = 40;            // messages remembered on this phone (only here, nothing synced)
let saved = [];
try { saved = JSON.parse(localStorage.getItem("yolk_phone") || "[]"); } catch (e) { saved = []; }
let lastSent = 0;           // a new conversation after 10 quiet minutes, like everywhere else

function remember() { try { localStorage.setItem("yolk_phone", JSON.stringify(saved.slice(-KEEP))); } catch (e) { } }
function when(t) {
  const d = new Date(t * 1000);
  return d.toLocaleDateString("en-US", { weekday: "short" }).toLowerCase() + " " +
         d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toLowerCase();
}
function draw() {
  const log = $("log");
  log.innerHTML = "";
  let prev = 0;
  for (const m of saved) {
    if (m.t - prev > 30 * 60) { const w = document.createElement("div"); w.className = "when"; w.textContent = when(m.t); log.appendChild(w); }
    prev = m.t;
    const p = document.createElement("div");
    p.className = "msg " + m.who;
    p.textContent = m.text;
    log.appendChild(p);
  }
  log.scrollTop = log.scrollHeight;
}
function add(who, text, t) { saved.push({ who, text, t: t || Math.floor(Date.now() / 1000) }); remember(); draw(); }

async function recent() {                 // texts she sent first show up here too
  try {
    const r = await (await fetch("recent", { cache: "no-store" })).json();
    for (const s of r.texts || []) {
      if (!saved.some(m => m.who === "her" && m.text === s.text)) saved.push({ who: "her", text: s.text, t: s.t });
    }
    saved.sort((a, b) => a.t - b.t);
    remember();
    $("status").textContent = "awake";
  } catch (e) { $("status").textContent = "can't reach her. home wi-fi?"; }
  draw();
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text) return;
  $("t").value = "";
  add("you", text);
  $("go").disabled = true;
  $("face").src = "face/talk.png";
  $("status").textContent = "typing...";
  const fresh = Date.now() - lastSent > 10 * 60000;
  lastSent = Date.now();
  try {
    const r = await (await fetch("chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ text, new: fresh }) })).json();
    add("her", r.reply || "...");
    $("status").textContent = "awake";
  } catch (err) {
    add("her", "i can't reach the mac from here. are you home?");
    $("status").textContent = "can't reach her. home wi-fi?";
  }
  $("face").src = "face/good.png";
  $("go").disabled = false;
};

draw();
recent();
document.addEventListener("visibilitychange", () => { if (!document.hidden) recent(); });
</script>
</body>
</html>
