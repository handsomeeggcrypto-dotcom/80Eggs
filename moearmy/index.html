<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MOEMOE ARMY</title>
<meta name="description" content="moemoe means ily. Lead the Moe army, free your squad and win the Anti Moemoe mouse army over with love.">
<meta property="og:title" content="MOEMOE ARMY">
<meta property="og:description" content="moemoe means ily. Win the mouse army over with love.">
<meta name="theme-color" content="#1d2414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1d2414; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; --s: 2; font-family: "Press Start 2P", monospace; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: calc(var(--s) * 6px); padding: calc(var(--s) * 8px); box-sizing: border-box; }
  .screen.on { display: flex; }
  #title { background: linear-gradient(#1d241499, #1d241422 45%, #1d241499); }
  #over { background: #12180ccc; }
  #pause { background: #12180caa; }
  .logo { font-size: calc(var(--s) * 16px); line-height: 1.25; color: #ffd42a;
    text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #e8960c, calc(var(--s)*2px) calc(var(--s)*2px) 0 #14121a; }
  .logo small { display: block; font-size: calc(var(--s) * 8px); color: #fff; margin-top: calc(var(--s) * 4px);
    text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  .ily { font-size: calc(var(--s) * 6px); color: #ff9fca; text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  .how { font-size: calc(var(--s) * 5px); line-height: 1.9; color: #e9f2d0; text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  .big { font-size: calc(var(--s) * 8px); line-height: 1.6; text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  .blink { animation: blink 1s steps(1) infinite; color: #ffd42a; }
  @keyframes blink { 50% { opacity: 0; } }
  .row { display: flex; gap: calc(var(--s) * 4px); flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: calc(var(--s) * 6px); color: #14121a; background: #ffd42a; border: 0; cursor: pointer;
    padding: calc(var(--s) * 4px) calc(var(--s) * 5px);
    box-shadow: inset calc(var(--s)*-1px) calc(var(--s)*-1px) 0 #e8960c, calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  button.alt { background: #e9f2d0; box-shadow: inset calc(var(--s)*-1px) calc(var(--s)*-1px) 0 #9fb07a, calc(var(--s)*1px) calc(var(--s)*1px) 0 #14121a; }
  button.x { background: #fff; }
  button:active { transform: translate(calc(var(--s)*1px), calc(var(--s)*1px)); box-shadow: none; }
  #mute { position: absolute; right: calc(var(--s) * 3px); bottom: calc(var(--s) * 3px); font-size: calc(var(--s) * 6px); }
  .stat { font-size: calc(var(--s) * 6px); line-height: 2; color: #e9f2d0; }
  .stat b { color: #ffd42a; font-weight: normal; }
  #rank { color: #8fd3ff; }
  .moeHeart { width: calc(var(--s) * 34px); height: auto; }
  #title { gap: calc(var(--s) * 4px); }
  .picker { display: flex; align-items: center; gap: calc(var(--s) * 4px); }
  #pCv { width: calc(var(--s) * 50px); height: calc(var(--s) * 61px); image-rendering: auto; }
  #pName { line-height: 1; }
  #editor { background: #12180cf2; gap: calc(var(--s) * 4px); }
  #edCv { width: calc(var(--s) * 130px); height: calc(var(--s) * 175px); image-rendering: auto; touch-action: none;
    background: repeating-conic-gradient(#3a4a24 0 25%, #2c381b 0 50%) 0 0 / calc(var(--s) * 10px) calc(var(--s) * 10px);
    box-shadow: 0 0 0 calc(var(--s) * 1px) #ffd42a; }
  #edZoom { width: calc(var(--s) * 120px); accent-color: #ffd42a; }
  #edMsg { color: #ff9fca; }
  #trophies { background: #12180cf5; justify-content: flex-start; gap: calc(var(--s) * 4px); }
  #troList { flex: 1; min-height: 0; width: 100%; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column;
    gap: calc(var(--s) * 3px); padding: calc(var(--s) * 1px); box-sizing: border-box; }
  .tro { display: flex; align-items: center; gap: calc(var(--s) * 4px); text-align: left; padding: calc(var(--s) * 3px);
    background: #ffffff0a; box-shadow: inset 0 0 0 calc(var(--s) * 1px) #ffffff1a; }
  .tro.got { background: #ffd42a17; box-shadow: inset 0 0 0 calc(var(--s) * 1px) #ffd42a99; }
  .tro canvas { width: calc(var(--s) * 24px); height: calc(var(--s) * 24px); flex: none; }
  .tro b { display: block; font-weight: normal; font-size: calc(var(--s) * 5.5px); line-height: 1.4; color: #8a917c; }
  .tro.got b { color: #ffd42a; }
  .tro span, .tro i { display: block; font-style: normal; font-size: calc(var(--s) * 4.5px); line-height: 1.6; color: #c9d2b0; }
  .tro i { color: #ff9fca; }
  #toast { position: absolute; left: 50%; top: calc(var(--s) * 24px); transform: translate(-50%, -400%); transition: transform 0.3s;
    display: flex; align-items: center; gap: calc(var(--s) * 4px); padding: calc(var(--s) * 3px) calc(var(--s) * 5px);
    background: #14121a; box-shadow: 0 0 0 calc(var(--s) * 1px) #ffd42a, calc(var(--s) * 2px) calc(var(--s) * 2px) 0 #000;
    pointer-events: none; z-index: 5; max-width: 92%; box-sizing: border-box; }
  #trophies.on ~ #mute { display: none; }
  #toast.on { transform: translate(-50%, 0); }
  #toastCv { width: calc(var(--s) * 20px); height: calc(var(--s) * 20px); flex: none; }
  #toast b { display: block; font-weight: normal; font-size: calc(var(--s) * 5px); color: #ff9fca; line-height: 1.6; }
  #toastName { display: block; font-size: calc(var(--s) * 5.5px); color: #ffd42a; line-height: 1.4; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="screen on" id="title">
      <img class="moeHeart" src="assets/heart_face.png" alt="">
      <div class="logo">MOEMOE<br>ARMY<small>OPERATION I.L.Y.</small></div>
      <div class="ily">moemoe means ily</div>
      <div class="how">DRAG TO MOVE, HEARTS FIRE ON THEIR OWN<br>FREE CAGED MOES TO GROW YOUR SQUAD<br>LOVE THE ANTI MOEMOE MICE</div>
      <div class="picker noStart">
        <button class="alt" id="pPrev">&lt;</button>
        <canvas id="pCv" width="144" height="176"></canvas>
        <button class="alt" id="pNext">&gt;</button>
      </div>
      <div class="stat noStart" id="pName"></div>
      <div class="row"><button id="enlistBtn">ENLIST YOUR MOE</button></div>
      <div class="row noStart" id="levelRow" style="display:none"><button class="alt" id="levelBtn">LEVEL</button></div>
      <div class="big blink" id="tapStart">TAP TO PLAY</div>
      <div class="stat" id="bestTitle"></div>
      <div class="row"><button class="alt" id="lbTitle">LEADERBOARD</button><button class="alt" id="troTitle">TROPHIES</button></div>
    </div>

    <div class="screen" id="over">
      <img class="moeHeart" src="assets/heart_face.png" alt="">
      <div class="logo" style="font-size:calc(var(--s)*12px)">MISSION<br>OVER</div>
      <div class="stat" id="overStats"></div>
      <div class="stat" id="rank"></div>
      <div class="row"><button id="again">PLAY AGAIN</button></div>
      <div class="row">
        <button class="x" id="share">SHARE ON X</button>
        <button class="alt" id="lbOver">LEADERBOARD</button>
      </div>
      <div class="row"><button class="alt" id="getMoe" style="display:none">GET A MOE</button></div>
      <div class="row"><button class="alt" id="menuOver">MAIN MENU</button><button class="alt" id="troOver">TROPHIES</button></div>
    </div>

    <div class="screen noStart" id="editor">
      <div class="big" id="edTitle">ENLIST YOUR MOE</div>
      <div class="how" id="edHelp"></div>
      <canvas id="edCv" width="260" height="350"></canvas>
      <input type="range" id="edZoom" min="0" max="100" value="50">
      <div class="row" id="edTools"><button class="alt" id="edAuto">AUTO ERASE</button><button class="alt" id="edUndo">UNDO</button></div>
      <div class="row"><button class="alt" id="edBack">CANCEL</button><button id="edNext">NEXT</button></div>
      <div class="how" id="edMsg"></div>
      <input type="file" id="edFile" accept="image/*" hidden>
    </div>

    <div class="screen" id="pause">
      <img class="moeHeart" src="assets/heart_face.png" alt="">
      <div class="logo" style="font-size:calc(var(--s)*12px)">PAUSED</div>
      <div class="big blink">TAP TO GO ON</div>
      <div class="row"><button class="alt" id="menuPause">MAIN MENU</button></div>
    </div>

    <div class="screen noStart" id="trophies">
      <div class="big">TROPHY CASE</div>
      <div class="stat" id="troCount"></div>
      <div id="troList"></div>
      <div class="row"><button class="alt" id="troBack">BACK</button></div>
    </div>

    <div id="toast"><canvas id="toastCv" width="32" height="32"></canvas><div><b>TROPHY GET!</b><span id="toastName"></span></div></div>

    <button class="alt" id="mute">SND ON</button>
  </div>
</div>

<script src="/scores.js"></script>
<script>
(() => {
"use strict";

// ---------- setup ----------
const SCATTER_URL = "https://www.scatter.art/c/moemoe-llc?shill=egg";   // GET A MOE button (hidden if empty)
const SITE_URL = "https://www.81eggs.com/moearmy/";
const BOARD = "moe-army";
const BEST_KEY = "moearmy_best", MUTE_KEY = "moearmy_mute";

const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");   // swapped briefly to draw the player preview
const stageEl = document.getElementById("stage");
const $ = (id) => document.getElementById(id);
const W = 180;
let H = 320, SCALE = 2, R = 3;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const lb = typeof Scores !== "undefined" ? Scores : null;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  if (!vw || !vh) return;   // hidden or not laid out yet: keep the last good size
  H = clamp(Math.round(W * vh / vw), 290, 390);
  SCALE = Math.min(vw / W, vh / H);
  R = clamp(Math.ceil(SCALE * (window.devicePixelRatio || 1)), 2, 4);
  cv.width = W * R; cv.height = H * R;
  ctx.imageSmoothingEnabled = false;
  stageEl.style.width = W * SCALE + "px";
  stageEl.style.height = H * SCALE + "px";
  stageEl.style.setProperty("--s", SCALE * 0.85);
  if (G) { G.px = clamp(G.px, 10, W - 10); G.py = clamp(G.py, 36, H - 16); }
}

// ---------- pixel art ----------
const PAL = {
  k: "#14121a", w: "#fff8f0", p: "#f7a3c4", g: "#7a9a3c", G: "#4f6a24", y: "#ffd42a", o: "#e8960c",
  r: "#d93a2b", b: "#4a2a1c", c: "#7d8290", C: "#585c69", W: "#f4f6ff", S: "#c4cde8", B: "#6fbfff",
  D: "#3b3f47", d: "#5b6069", m: "#b9bdc7", u: "#6e7380", U: "#4c505b", v: "#7b4c92", P: "#ff7eb6", q: "#ffc0dc",
  h: "#14121a",
};
function sprite(rows, over) {
  const pal = Object.assign({}, PAL, over || {});
  const w = Math.max.apply(null, rows.map((r) => r.length));
  const c = document.createElement("canvas");
  c.width = w; c.height = rows.length;
  const x = c.getContext("2d");
  rows.forEach((r, j) => {
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];
      if (ch === "." || ch === " ") continue;
      x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1);
    }
  });
  return c;
}
function white(c) {
  const o = document.createElement("canvas");
  o.width = c.width; o.height = c.height;
  const x = o.getContext("2d");
  x.drawImage(c, 0, 0);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = "#fff"; x.fillRect(0, 0, o.width, o.height);
  return o;
}

// soldier Moe: a head pixelled by hand from the soldier art, 24 x 23, on a 16-wide uniform.
// PHOTO face mode swaps the head for assets/head_photo.png (made by build_assets.py).
const HE = (a, b) => "hhh" + "ww" + a + "www" + b + "ww" + "hhh" + ".";
const HEAD = [
  "........oooooo..........",
  "......oolllgggoo........",
  ".....olllggggggggo......",
  "....olggggBBBBBBBgo.....",
  "...olgggggByByByBggo....",
  "...oggggggByyyyyBgggo...",
  "..oggggggggggggggggGGo..",
  "..oGgggggggggggggggGGGo.",
  ".ohGGGGgggggggggggGGGGGo",
  ".hhhhGGGGGGGGGGGGGGGGGGo",
  "hhhHhwoooooooooooooooo..",
  "hhhwwwwwwwwwwwwwwwwwhhh.",
  HE("wkkkw", "wkkkw"),
  HE("kkwwk", "kkwwk"),
  HE("kkwwk", "kkwwk"),
  HE("kkkkk", "kkkkk"),
  HE("kkkkk", "kkkkk"),
  HE("wkkkw", "wkkkw"),
  "hhh" + "pp" + "wfwfw" + "www" + "wfwfw" + "pp" + "hhh" + ".",
  "hhhh" + "wwwwwww" + "rr" + "wwwwwww" + "hhhh",
  "hhhhh" + "wwwwwwwwwwwww" + "hhhhhh",
  "hhhhhhh" + "swwwwwwws" + "hhhhhhhh",
  ".hhh....wwwwwww....hhh..",
];
const BODY = [
  "....GrrGGrrG....",
  "..GGggggggggGG..",
  ".GgGggggggggGgG.",
  ".GgGGGGbbGGGGgG.",
  ".GgGggggggyrGgG.",
  ".GgGgggbbgggGgG.",
  ".GgGggggggggGgG.",
  ".wwGgggbbgggGww.",
  "...GggggggggG...",
  "...GGGGGGGGGG...",
];
const LEGS = [["...GggG..GggG...", "...kkkk...kkk..."], ["...GggG..GggG...", "...kkk...kkkk..."]];
const HEAD_PX = sprite(HEAD, {
  o: "#222a10", l: "#9aa452", g: "#75843c", G: "#55622a", B: "#2f5fd0", r: "#e0607e", f: "#c9a49a",
  H: "#3a3a44", s: "#e6d8d2",
});
const HEAD_PX_W = white(HEAD_PX);
const BODY_F = LEGS.map((l) => sprite(BODY.concat(l)));
const BODY_W = white(BODY_F[0]);
const RED_ROWS = BODY.map((r, i) => {
  const a = r.split("").map((c) => (c === "b" ? "k" : c === "y" || c === "r" && i === 4 ? "g" : c));
  if (i >= 1 && i <= 8) { if (a[4] !== ".") a[4] = "k"; if (a[11] !== ".") a[11] = "k"; }   // harness straps
  if (i === 4) { a[4] = "s"; a[11] = "s"; }                                                // silver buckles
  return a.join("");
});
const BODY_RED = LEGS.map((l) => sprite(RED_ROWS.concat(l), { g: "#d8352a", G: "#8e1d17", r: "#14121a", s: "#d8d8d8" }));
// Commander Crayons: blue monster hoodie with purple spots and a grey front
const CRAYON_ROWS = BODY.map((r, i) => {
  const a = r.split("").map((c, j) => (c === "b" || c === "y" || (c === "r" && i === 4) ? "e" : c === "r" ? "g" : c));
  for (const [y, x] of [[1, 4], [2, 9], [4, 6], [5, 10], [6, 5], [7, 8], [2, 2], [5, 2], [6, 13], [8, 6]]) if (i === y && a[x] === "g") a[x] = "p";
  return a.join("");
});
const BODY_CRAYON = LEGS.map((l) => sprite(CRAYON_ROWS.concat(l), { g: "#4a63d8", G: "#2c3b94", p: "#b06ad8", e: "#a9adb5" }));
const CRAYONS_HEAD = new Image();
CRAYONS_HEAD.src = "assets/crayons_head.png";
let CRAYONS_HEAD_W = null;
CRAYONS_HEAD.onload = () => { CRAYONS_HEAD_W = tinted(CRAYONS_HEAD, "#fff"); renderPicker(); };
// General Bluu: navy uniform, gold collar, buttons and shoulder boards
const BLUU_ROWS = BODY.map((r, i) => {
  const a = r.split("").map((c) => (c === "b" || c === "r" ? "y" : c === "y" ? "g" : c));
  if (i === 2) { a[1] = "y"; a[2] = "y"; a[13] = "y"; a[14] = "y"; }
  return a.join("");
});
const BODY_BLUU = LEGS.map((l) => sprite(BLUU_ROWS.concat(l), { g: "#2b3f8f", G: "#18245a", y: "#ffd42a" }));
const BLUU_HEAD = new Image();
BLUU_HEAD.src = "assets/bluu_head.png";
let BLUU_HEAD_W = null;
BLUU_HEAD.onload = () => { BLUU_HEAD_W = tinted(BLUU_HEAD, "#fff"); renderPicker(); };
const BODIES = { bradley: () => BODY_RED, crayons: () => BODY_CRAYON, bluu: () => BODY_BLUU };
const BRADLEY_HEAD = new Image();
BRADLEY_HEAD.src = "assets/bradley_head.png";
let BRADLEY_HEAD_W = null;
BRADLEY_HEAD.onload = () => { BRADLEY_HEAD_W = tinted(BRADLEY_HEAD, "#fff"); renderPicker(); };
const HEAD_PHOTO = new Image();
HEAD_PHOTO.src = "assets/head_photo.png";
const photoReady = () => HEAD_PHOTO.complete && HEAD_PHOTO.naturalWidth > 0;
let HEAD_PHOTO_W = null;
HEAD_PHOTO.onload = () => { HEAD_PHOTO_W = tinted(HEAD_PHOTO, "#fff"); renderPicker(); };

// your own Moe: a head you upload and cut out on the title screen. Saved on this device only.
const CUSTOM_KEY = "moearmy_custom", PLAYER_KEY = "moearmy_player";
const HW = 130, HH = 125;   // the head frame in editor pixels; drawn 26 x 25 in the game
let CUSTOM = null, CUSTOM_W = null, customNote = "";
function loadCustom(url) {
  if (!url) { CUSTOM = CUSTOM_W = null; return; }
  const im = new Image();
  im.onload = () => {
    CUSTOM = im; CUSTOM_W = tinted(im, "#fff");
    if (playerId === "custom") viewId = "custom";   // the picture loads a moment after the menu, so jump to it
    renderPicker();
  };
  im.src = url;
}

// Who you can play as. Unlockable players slot in here later, e.g.
// { id: "general", name: "GENERAL MOE", head: "photo", unlock: { stage: 5, text: "REACH STAGE 5" } }
// unlock can ask for { mice: n } (mice loved, added up over every game) or { stage: n } (best stage reached)
const STAGE_KEY = "moearmy_best_stage", MICE_KEY = "moearmy_mice_total", FREED_KEY = "moearmy_freed_total";
const PLAYERS = [
  { id: "soldier", name: "SOLDIER MOE", head: "photo" },
  { id: "pixel", name: "PIXEL MOE", head: "pixel" },
  { id: "bradley", name: "CEO BRADLEY", head: "bradley", unlock: { mice: 100, text: "LOVE 100 MICE" },
    perk: "NO MOE LEFT BEHIND", guard: true },   // guard: mouse shots bounce off your squad
  { id: "crayons", name: "COMMANDER CRAYONS", head: "crayons", unlock: { stage: 4, text: "REACH STAGE 4" },
    perk: "HEARTS PIERCE 3 MICE", crayon: true },   // crayon: rainbow hearts that keep going
  { id: "bluu", name: "GENERAL BLUU", head: "bluu", unlock: { freed: 300, text: "FREE 300 MOES" },
    perk: "BIG BLUE HEARTS x2", blue: true },   // blue: your own hearts are big and count double
  { id: "custom", name: "YOUR MOE", head: "custom" },
];
let playerId = store.get(PLAYER_KEY) || (store.get("moearmy_face") === "pixel" ? "pixel" : "soldier");
const bestStage = () => +(store.get(STAGE_KEY) || 0);
const miceTotal = () => +(store.get(MICE_KEY) || 0);
const freedTotal = () => +(store.get(FREED_KEY) || 0);
const unlocked = (p) => !p.unlock ||
  (p.unlock.mice ? miceTotal() >= p.unlock.mice : p.unlock.freed ? freedTotal() >= p.unlock.freed : bestStage() >= p.unlock.stage);
const available = () => PLAYERS.filter((p) => p.id !== "custom" || CUSTOM);   // shown in the picker, locked or not
const player = () => available().find((p) => p.id === playerId && unlocked(p)) || PLAYERS[0];
let viewId = playerId;   // who the title picker is showing (can be a locked player)

// (x, y) is the middle of the soldier: head from y-20, uniform from y+3, boots end at y+14.
// kind: "photo" (the standard soldier face), "pixel" or "custom"
function drawMoe(x, y, frame, flash, kind) {
  const hx = Math.round(x - 12), hy = Math.round(y - 20);
  ctx.drawImage((BODIES[kind] ? BODIES[kind]() : BODY_F)[frame % 2], hx + 4, hy + 23);
  drawHead(hx, hy, kind || "photo", flash);
  if (flash) {
    ctx.globalAlpha = flash;
    ctx.drawImage(BODY_W, hx + 4, hy + 23);
    ctx.globalAlpha = 1;
  }
}
function drawHead(hx, hy, kind, flash) {
  let img = null, wimg = null, x, y, w, h;
  if (kind === "bradley" && BRADLEY_HEAD.complete && BRADLEY_HEAD.naturalWidth) {
    img = BRADLEY_HEAD; wimg = BRADLEY_HEAD_W;
    w = 25; h = w * BRADLEY_HEAD.naturalHeight / BRADLEY_HEAD.naturalWidth; x = hx; y = hy + 25 - h;

function drawMeower(m) {

  if (m.kind === "citizen") { R("#4a4658", -1 + wig, 1 + hop, 2, 6); R("#c9c2bc", -4 + wig, 3 + hop, 1, 1); }   // jacket zip and pin
  if (m.kind === "worker") { R("#24558a", -4 + wig, 1 + hop, 2, 3); R("#24558a", 2 + wig, 1 + hop, 2, 3); R("#f2c440", -1 + wig, 4 + hop, 2, 2); }

function updateMeowers(dt, speed) {
  if (!G.demo && (G.meowT -= dt) <= 0) { G.meowT = rnd(14, 22); spawnMeower(); }
  for (const m of G.meows) {
    m.t += dt;
    if (m.saved) { m.x += m.vx * dt; m.y += speed * 0.4 * dt; continue; }
    m.y += speed * dt;
    if (hit(m, m.x, m.y - 6, 18, 22, null, G.px, G.py - 2, 16, 24)) {
      m.saved = true; m.t = 0; m.vx = m.x < W / 2 ? -60 : 60;
      G.meowers++;
      store.set(MEOWERS_KEY, +(store.get(MEOWERS_KEY) || 0) + 1);
      G.score += 300;
      SFX.meow();
      burst(m.x, m.y - 10, 8, SMALL_HEART, 50);
      pop(m.x, m.y - 30, "MEOW! +300", "#ffd42a");
      if (G.meowers === 1) banner(MEOWER_NAME[m.kind], "SAVED!", 1.6);
    }
  }
  G.meows = G.meows.filter((m) => m.y < H + 30 && m.x > -20 && m.x < W + 20);
}

function tone(f, dur, type, vol, f2, delay) {
  if (muted || !AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();

  g.gain.setValueAtTime(vol || 0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function drawBuilding(b) {
  const x = b.side ? ST.bld2 : 0, y = Math.round(b.y), w = ST.bld;
  ctx.fillStyle = b.col; ctx.fillRect(x, y, w, b.h);

// neon and streetlights are drawn after the sunset tint, so they stay bright as night falls
function drawStripLights(night) {
  for (const d of G.deco) if (d.kind === "lamp") {
    const lx = d.x + (d.left ? 10 : -8), g = ctx.createRadialGradient(lx, d.y, 0, lx, d.y, 20);
    g.addColorStop(0, "rgba(255,190,110," + (0.18 + night * 0.22) + ")"); g.addColorStop(1, "rgba(255,190,110,0)");
    ctx.fillStyle = g; ctx.fillRect(lx - 20, d.y - 20, 40, 40);
  }
  for (const b of G.blocks) {
    if (!b.sign) continue;
    const img = neonSign(b.sign, b.neon), x = b.side ? ST.bld2 - 9 : ST.bld - 2, y = Math.round(b.y + (b.h - img.height) / 2);
    ctx.globalAlpha = b.flick > 0 ? 0.3 : 1;
    const g = ctx.createRadialGradient(x + 5, y + img.height / 2, 0, x + 5, y + img.height / 2, img.height * 0.7);
    g.addColorStop(0, b.neon + (night > 0.5 ? "66" : "33")); g.addColorStop(1, b.neon + "00");
    ctx.fillStyle = g; ctx.fillRect(x - 20, y - 10, 51, img.height + 20);
    ctx.drawImage(img, x, y);
    if (b.kind === "gogo" && b.flick <= 0) {   // marquee bulbs chasing round
      ctx.fillStyle = "#fff3a0";
      const bx = b.side ? ST.bld2 - 1 : ST.bld, on = Math.floor(G.t * 6) % 3;
      for (let i = on; i < b.h; i += 3) ctx.fillRect(bx, Math.round(b.y) + i, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}
const levelNight = () => clamp((G.stage - G.levelStart) / 5, 0, 1);   // counts from when you arrived
function drawSunset() {   // warm orange up the street fading to purple, then a dark blue that deepens each stage
  const night = levelNight();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(255,130,60," + (0.22 - night * 0.12) + ")");
  g.addColorStop(1, "rgba(130,60,200," + (0.16 + night * 0.06) + ")");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (night > 0) { ctx.fillStyle = "rgba(14,8,34," + night * 0.34 + ")"; ctx.fillRect(0, 0, W, H); }
  drawStripLights(night);
}

// ---------- level 3: the moemoe LLC factory ----------
// The mice have taken over the factory where the army's caps and hoodies get made. Seen from above: machine bays
// down both walls (sewing stations, looms, dye vats, fabric racks, crates, boilers), conveyor belts carrying
// fresh uniforms, and a painted walkway down the middle. Each stage is later in the night shift, and from
// stage 4 the alarm beacons start spinning.
const FA = { bay: 28, belt: 30, beltW: 16, belt2: 134, walk: 48, walk2: 132, bay2: 152 };
const FACTORY_TILE = (() => {
  const c = document.createElement("canvas"); c.width = W; c.height = 64;
  const x = c.getContext("2d");
  let seed = 23;
  const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const R = (col, a, b, w, h) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  R("#7d838c", 0, 0, W, 64);                                     // concrete floor
  R("#666c75", 0, 0, FA.bay, 64); R("#666c75", FA.bay2, 0, W - FA.bay2, 64);   // machine bays
  R("#6f757e", 0, 0, W, 1); R("#6f757e", 0, 32, W, 1); R("#6f757e", 90, 0, 1, 64);   // slab seams
  for (let i = 0; i < 160; i++) R(r() < 0.5 ? "#737982" : "#888e97", Math.floor(r() * W), Math.floor(r() * 64), 1, 1);
  for (let y = 0; y < 64; y += 8) {                               // hazard stripes where the bays start
    R("#f2c440", FA.bay, y, 2, 4); R("#22252a", FA.bay, y + 4, 2, 4);
    R("#f2c440", FA.bay2 - 2, y + 4, 2, 4); R("#22252a", FA.bay2 - 2, y, 2, 4);
  }
  R("#e0b43a", FA.walk, 0, 1, 64); R("#e0b43a", FA.walk2 - 1, 0, 1, 64);   // walkway lines
  return c;
})();

const UNIFORMS = ["cap", "hoodie", "hoodie", "tee", "box"];
const HOODIE_COLS = ["#5b7a2f", "#ff7eb6", "#2f6fb0", "#ffd42a", "#14121a"];
const MACHINES = [
  { kind: "sewing", w: 4 }, { kind: "loom", w: 2 }, { kind: "vats", w: 2 },
  { kind: "rack", w: 2 }, { kind: "crates", w: 2 }, { kind: "boiler", w: 1 },
];
function addMachine(side, bottom) {
  const pool = [];
  MACHINES.forEach((m) => { for (let i = 0; i < m.w; i++) pool.push(m.kind); });
  const kind = pick(pool);
  const h = { sewing: 46, loom: 54, vats: 50, rack: 40, crates: 36, boiler: 34 }[kind] + Math.round(rnd(0, 6));
  G.blocks.push({ kind, side, y: bottom - h, h, seed: Math.floor(rnd(0, 999)),
    cols: [pick(HOODIE_COLS), pick(["#ff7eb6", "#ffd42a", "#5ee8ff", "#5b7a2f"]), pick(HOODIE_COLS)] });
}
function factoryScroll(dy) {
  for (const b of G.blocks) b.y += dy;
  G.blocks = G.blocks.filter((b) => b.y < H + 4);
  for (const side of [0, 1]) while (topBlock(side) > -10) addMachine(side, topBlock(side) === Infinity ? H : topBlock(side));
  // the belts run a bit faster than the floor scrolls, so the uniforms ride past
  G.beltOff = (G.beltOff || 0) + dy * 1.5;
  for (const u of G.belt) u.y += dy * 1.5;
  G.belt = G.belt.filter((u) => u.y < H + 12);
  for (const lane of [0, 1]) {
    let top = Infinity;
    for (const u of G.belt) if (u.lane === lane) top = Math.min(top, u.y);
    if (top === Infinity) for (let y = 4; y < H; y += rnd(16, 40)) addUniform(lane, y);
    else if (top > rnd(14, 34)) addUniform(lane, -10);
  }
  // steam from the boilers
  for (const b of G.blocks) if (b.kind === "boiler" && b.y > -20 && b.y < H && Math.random() < 0.05) {
    G.steam.push({ x: (b.side ? FA.bay2 + 14 : 14) + rnd(-3, 3), y: b.y + b.h / 2, t: 0 });
  }
  for (const s of G.steam) { s.t += 1 / 60; s.y += dy - 0.25; s.x += Math.sin(s.t * 3 + s.y) * 0.15; }
  G.steam = G.steam.filter((s) => s.t < 1.6);
}
function addUniform(lane, y) {
  G.belt.push({ lane, y, kind: pick(UNIFORMS), col: pick(HOODIE_COLS) });
}

function addFactoryDeco(y) {
  const r = Math.random(), x = rnd(FA.walk + 10, FA.walk2 - 10);
  const d = { y, x };
  if (r < 0.14) Object.assign(d, { kind: "forklift", x: rnd(FA.walk + 14, FA.walk2 - 14), flip: Math.random() < 0.5 });
  else if (r < 0.3) Object.assign(d, { kind: "pallet", n: 1 + Math.floor(rnd(0, 4)) });
  else if (r < 0.42) Object.assign(d, { kind: "lamp" });
  else if (r < 0.52) Object.assign(d, { kind: "oil" });
  else if (r < 0.62) Object.assign(d, { kind: "arrow" });
  else if (r < 0.72) Object.assign(d, { kind: "scraps", col: pick(HOODIE_COLS) });
  else if (r < 0.8) Object.assign(d, { kind: "spool", col: pick(["#ff7eb6", "#ffd42a", "#5ee8ff", "#e9e2dc"]) });
  else if (r < 0.86) Object.assign(d, { kind: "bucket" });
  else if (r < 0.93) Object.assign(d, { kind: "logo", x: FA.walk + 6 });
  else Object.assign(d, { kind: "hazard", x: FA.walk + 1 });
  G.deco.push(d);
}
function drawFactoryDeco(d) {
  const x = Math.round(d.x), y = Math.round(d.y);

      R("#22252a", -7, -6, 1, 4); R("#22252a", 6, -6, 1, 4); R("#22252a", -7, 2, 1, 4); R("#22252a", 6, 2, 1, 4);
      R("#3e3546", -4, -4, 8, 6); R("#7a7f88", -3, -3, 6, 1);           // seat and cage
      R("#4a4f57", -4, f > 0 ? 7 : -12, 2, 5); R("#4a4f57", 2, f > 0 ? 7 : -12, 2, 5);   // forks

    }
    case "pallet":

      for (let i = 0; i < d.n; i++) {

    case "oil": R("#5a5f68", -5, -1, 10, 3); R("#5a5f68", -3, -2, 6, 5); R("#6e6a80", -2, -1, 2, 1); break;
    case "arrow":
      R("#e0b43a", -1, -6, 2, 10); R("#e0b43a", -3, 1, 6, 1); R("#e0b43a", -2, 2, 4, 1); break;
    case "scraps":
      R(d.col, -4, -1, 3, 1); R(d.col, 1, 1, 2, 2); R("#e9e2dc", -1, 3, 4, 1); break;
    case "spool":
      R("#8a6a3a", -2, -3, 5, 1); R(d.col, -2, -2, 5, 4); R("#8a6a3a", -2, 2, 5, 1);
      R(d.col, 3, 0, 6, 1); break;   // a loose thread
    case "bucket": R("#2f6fb0", -3, -3, 6, 6); R("#5aa0e0", -2, -2, 4, 4); R("#8a6a3a", 2, -6, 1, 5); break;
    case "hazard": for (let i = 0; i < 82; i += 6) { R("#f2c440", i, 0, 3, 5); R("#22252a", i + 3, 0, 3, 5); } break;
    case "logo": {   // MOEMOE LLC painted on the floor, big and worn
      ctx.globalAlpha = 0.45;

        if (g) for (let p = 0; p < 15; p++) if (g[p] === "1") { ctx.fillStyle = "#f2c440"; ctx.fillRect(cx + (p % 3) * 2, y + Math.floor(p / 3) * 2, 2, 2); }
        cx += 7;

}

function drawBelts() {
  for (const bx of [FA.belt, FA.belt2]) {
    ctx.fillStyle = "#4a4f57"; ctx.fillRect(bx, 0, 2, H); ctx.fillRect(bx + FA.beltW - 2, 0, 2, H);
    ctx.fillStyle = "#2b2e33"; ctx.fillRect(bx + 2, 0, FA.beltW - 4, H);
    ctx.fillStyle = "#383c43";
    for (let y = Math.floor(G.beltOff || 0) % 4 - 4; y < H; y += 4) ctx.fillRect(bx + 2, y, FA.beltW - 4, 1);
    ctx.fillStyle = "#7a7f88";
    for (let y = Math.floor(G.scroll) % 12 - 12; y < H; y += 12) { ctx.fillRect(bx, y, 2, 1); ctx.fillRect(bx + FA.beltW - 2, y, 2, 1); }
  }
  for (const u of G.belt) {
    const x = (u.lane ? FA.belt2 : FA.belt) + 8, y = Math.round(u.y);
    const R = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(x + a, y + b, w, h); };
    if (u.kind === "hoodie") {   // folded hoodie, with a little moemoe heart on it
      R(u.col, -5, -4, 10, 8); R("#00000033", -5, 0, 10, 1); R("#00000033", -1, -4, 2, 4);
      R("#ffd42a", 1, 1, 2, 2);
    } else if (u.kind === "cap") {   // a fresh army cap, the one the Moes wear
      R("#4a6a28", -4, -3, 8, 6); R("#5b7a2f", -3, -2, 6, 3); R("#3a5420", -4, 3, 8, 2); R("#ffd42a", -1, -1, 2, 1);
    } else if (u.kind === "tee") {   // a white tee with a pink heart

      R("#c79a5c", -5, -4, 10, 8); R("#a87d43", -5, -1, 10, 1); R("#ff7eb6", -1, 1, 2, 2);
    }

}

function drawMachine(b) {
  const x0 = b.side ? FA.bay2 : 0, y0 = Math.round(b.y), w = FA.bay;
  const R = (c, a, bb, ww, hh) => { ctx.fillStyle = c; ctx.fillRect(x0 + a, y0 + bb, ww, hh); };
  switch (b.kind) {
    case "sewing":   // two work tables, each with a sewing machine, a spool and the piece being sewn
      for (let i = 0; i < 2; i++) {
        const t = 3 + i * 22;
        R("#00000033", 3, t + 2, 23, 18);
        R("#9a7448", 2, t, 23, 17); R("#7d5c33", 2, t + 16, 23, 1);
        R(b.cols[i], 5, t + 5, 11, 9);                                   // the fabric
        R("#e9e2dc", 13, t + 3, 9, 6); R("#c9c2bc", 13, t + 8, 9, 1); R("#e9e2dc", 19, t + 9, 3, 4);   // the machine
        R("#14121a", 14, t + 9 + ((Math.floor(G.t * 12) + i) % 2), 1, 2);   // needle going up and down
        R(b.cols[2], 4, t + 1, 3, 3);                                    // spool
      }
      break;
    case "loom": {   // a big loom: coloured warp threads with the shuttle zipping across
      R("#00000033", 3, 3, 24, b.h - 4);
      R("#4a4f57", 2, 2, 24, b.h - 4); R("#5e636c", 3, 3, 22, 2); R("#5e636c", 3, b.h - 6, 22, 2);
      for (let i = 0; i < 10; i++) R(b.cols[i % 3], 4 + i * 2, 6, 1, b.h - 13);
      R("#e9e2dc", 4, Math.round(b.h * 0.6), 20, 3);                     // woven cloth so far
      const s = (Math.sin(G.t * 4 + b.seed) + 1) / 2;
      R("#c79a5c", 3 + Math.round(s * 18), Math.round(b.h * 0.45), 5, 2);   // shuttle
      break;
    }
    case "vats":   // dye vats in pink, yellow and blue
      for (let i = 0; i < 2; i++) {
        const cy = 13 + i * 23;
        ctx.fillStyle = "#00000033"; ctx.beginPath(); ctx.arc(x0 + 15, y0 + cy + 2, 10, 0, 7); ctx.fill();
        ctx.fillStyle = "#7a7f88"; ctx.beginPath(); ctx.arc(x0 + 14, y0 + cy, 10, 0, 7); ctx.fill();
        ctx.fillStyle = ["#ff7eb6", "#ffd42a", "#5ee8ff"][(b.seed + i) % 3];
        ctx.beginPath(); ctx.arc(x0 + 14, y0 + cy, 8, 0, 7); ctx.fill();
        R("#ffffff55", 10, cy - 4, 3, 1);
        R("#ffffff44", 14 + Math.round(Math.sin(G.t * 2 + i) * 3), cy + 1, 2, 2);   // bubbling
      }
      break;
    case "rack":   // bolts of fabric on a rack
      R("#4a4f57", 2, 2, 2, b.h - 4); R("#4a4f57", 24, 2, 2, b.h - 4);
      for (let i = 0, y = 4; y < b.h - 6; i++, y += 5) {
        const c = HOODIE_COLS[(b.seed + i) % HOODIE_COLS.length];
        R(c, 4, y, 20, 4); R("#ffffff33", 4, y, 20, 1); R("#00000044", 4, y + 3, 20, 1);
        R("#14121a55", 22, y, 2, 4);
      }
      break;
    case "crates":
      for (let i = 0; i < 4; i++) {
        const cx = 2 + (i % 2) * 12, cy = 2 + Math.floor(i / 2) * 16;
        R("#a87d43", cx, cy, 11, 14); R("#c79a5c", cx + 1, cy + 1, 9, 12);
        R("#a87d43", cx + 1, cy + 4, 9, 1); R("#a87d43", cx + 1, cy + 9, 9, 1);
        if (i % 3 === 0) ctx.drawImage(PINK_HEART, x0 + cx + 3, y0 + cy + 5);
      }
      break;
    case "boiler":
      R("#4a4f57", 0, b.h / 2 - 2, 28, 4);                              // pipe
      ctx.fillStyle = "#00000033"; ctx.beginPath(); ctx.arc(x0 + 15, y0 + b.h / 2 + 2, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#9a5a3a"; ctx.beginPath(); ctx.arc(x0 + 14, y0 + b.h / 2, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#b8704a"; ctx.beginPath(); ctx.arc(x0 + 13, y0 + b.h / 2 - 1, 7, 0, 7); ctx.fill();
      R("#e9e2dc", 12, b.h / 2 - 2, 3, 3); R("#c0392b", 13, b.h / 2 - 1, 1, 1);   // pressure gauge
      break;
  }
}

// ceiling lamps, steam and alarm beacons go on after the shift tint, so they stay bright
function drawFactoryLights(night) {
  for (const d of G.deco) if (d.kind === "lamp") {
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 26);
    g.addColorStop(0, "rgba(255,230,170," + (0.16 + night * 0.2) + ")"); g.addColorStop(1, "rgba(255,230,170,0)");
    ctx.fillStyle = g; ctx.fillRect(d.x - 26, d.y - 26, 52, 52);
    ctx.fillStyle = "#b9bdc4"; ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, 7); ctx.fill();   // the lamp shade hanging above
    ctx.fillStyle = "#fff3c8"; ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, 7); ctx.fill();
  }
  for (const s of G.steam) {
    ctx.fillStyle = "rgba(235,240,245," + (0.35 * (1 - s.t / 1.6)) + ")";
    const r = 2 + s.t * 5;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill();
  }
  if (G.stage < 4) return;
  for (const b of G.blocks) if (b.kind === "loom" || b.kind === "boiler") {   // the alarm is going off
    const bx = b.side ? FA.bay2 + 4 : 23, by = b.y + 4, a = G.t * 5 + b.seed;
    ctx.fillStyle = "rgba(255,40,40,0.18)";
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, 26, a, a + 0.7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, 26, a + Math.PI, a + Math.PI + 0.7); ctx.fill();
    ctx.fillStyle = "#ff3a3a"; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3);
  }
}
function drawShift() {   // fluorescent blue-grey tint that gets dimmer through the night shift
  const night = levelNight();
  ctx.fillStyle = "rgba(60,80,120," + (0.12 + night * 0.08) + ")"; ctx.fillRect(0, 0, W, H);
  if (night > 0) { ctx.fillStyle = "rgba(10,12,28," + night * 0.3 + ")"; ctx.fillRect(0, 0, W, H); }
  drawFactoryLights(night);
}

// tank, drawn from rectangles. 26 x 28, (x, y) is the top-left
function drawTank(e, flash) {
  const x = Math.round(e.x - 13), y = Math.round(e.y - 14);
  const L = e.loved;
  const body = flash ? "#fff" : L ? "#ff8fc0" : "#6d717a";
  const dark = flash ? "#fff" : L ? "#d45a92" : "#474a52";
  const lite = flash ? "#fff" : L ? "#ffc4de" : "#8d919b";
  const R = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(x + a, y + b, w, h); };
  R(dark, 0, 2, 6, 22); R(dark, 20, 2, 6, 22);
  if (!flash) {
    const off = Math.floor(e.tread) % 3;
    for (let i = 0; i < 7; i++) { R(lite, 1, 3 + off + i * 3, 4, 1); R(lite, 21, 3 + off + i * 3, 4, 1); }

let G = null, state = "title", paused = false;

const SLOTS = [[-22, 12], [22, 12], [-44, 22], [44, 22], [0, 30], [-66, 30], [66, 30], [-22, 40]];
// The first 8 Moes march in a V around you. Everyone after that joins the army ranks along the bottom of the
// screen, filling it from the bottom up, and the ranks lean a little toward you as you move.
const RANK = 10;
// the ranks stay in the bottom third of the screen, so taller phones fit a few more rows
const armyMax = () => SLOTS.length + RANK * (Math.max(1, Math.floor((H / 3 - 20) / 16)) + 1);
// once the army is full, Moes you free promote someone instead: the first extra one, then every 5th
const PROMOTE = ["crayons", "bluu", "bradley"];
function freeMoe(x, y) {
  if (G.squad.length < armyMax()) { addSquad(x, y); return; }
  G.extra++;
  if (G.extra !== 1 && G.extra % 5) return;
  const plain = G.squad.filter((m) => !m.kind);
  if (!plain.length) return;
  const m = plain[Math.floor(rnd(0, plain.length))];
  m.kind = PROMOTE[G.promoted++ % PROMOTE.length];
  burst(m.x, m.y - 10, 6, SMALL_HEART, 40);
  pop(m.x, m.y - 26, "PROMOTED!", "#ffd42a");
  award("promote");
}
function slotPos(i) {
  if (i < SLOTS.length) return [clamp(G.px + SLOTS[i][0], 10, W - 10), Math.min(G.py + SLOTS[i][1], H - 14)];
  const j = i - SLOTS.length, rank = Math.floor(j / RANK), col = j % RANK;
  const lean = (G.px - W / 2) * 0.12 + Math.sin(G.t * 1.5 + rank) * 1.5;
  return [clamp(9 + col * 18 + (rank % 2 ? 9 : 0) + lean, 8, W - 8), H - 14 - rank * 16];
}

function addDeco(y) {

  G.deco.push({ kind, x: rnd(4, W - 10), y, n: 2 + Math.floor(rnd(0, 3)),

function spawnEnemy() {
  const s = G.stage;
  const r = Math.random();
  const mouseChance = Math.min(0.25 + s * 0.1, 0.6);
  if (r < 0.18 && s >= 2) {                       // a line of glooms
    const n = 3 + Math.floor(rnd(0, Math.min(s, 3)));
    const gap = 30, x0 = W / 2 - ((n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) G.enemies.push(gloom(x0 + i * gap, -12 - i * 6));
  } else if (r < 0.18 + mouseChance) {
    // from stage 4 some of the mice are brutes, a few more each stage
    G.enemies.push(s >= 4 && Math.random() < Math.min(0.12 + (s - 4) * 0.03, 0.3) ? brute(rnd(22, W - 22), -34) : mouse(rnd(16, W - 16), -24));
    if (s >= 4 && Math.random() < 0.4) G.enemies.push(mouse(rnd(16, W - 16), -50));
    if (Math.random() < G.squad.length / 80) G.enemies.push(mouse(rnd(16, W - 16), -76));
    if (G.squad.length > 50 && Math.random() < 0.5) G.enemies.push(mouse(rnd(16, W - 16), -102));
  } else {
    G.enemies.push(gloom(rnd(14, W - 14), -10));
  }
}

function hit(a, ax, ay, aw, ah, b, bx, by, bw, bh) {
  return Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;

  if (e.type === "tank") { award("tread"); if (player().id === "bradley") award("pin"); }
  pop(e.x, e.y - 8, "+" + e.pts);

function drawIcon(cv, t, got) {
  const x = cv.getContext("2d"), ic = t.icon;
  const k = Math.max(1, Math.floor(Math.min(cv.width / ic.width, cv.height / ic.height)));
  x.clearRect(0, 0, cv.width, cv.height);
  x.imageSmoothingEnabled = false;
  x.drawImage(ic, Math.floor((cv.width - ic.width * k) / 2), Math.floor((cv.height - ic.height * k) / 2), ic.width * k, ic.height * k);
  if (!got) {   // not earned yet: a dark shape
    x.globalCompositeOperation = "source-atop"; x.fillStyle = "#3d4832"; x.fillRect(0, 0, cv.width, cv.height);
    x.globalCompositeOperation = "source-over";
  }
}

  const games = +(store.get(GAMES_KEY) || 0) + 1;
  store.set(GAMES_KEY, games);
  if (games >= 25) award("boots");
  if (G.mice === 0) award("soggy");
  if (G.score >= 50000) award("egg");
}

// ---------- update ----------
const keys = {};
function update(dt) {
  G.t += dt;
  const speed = 20 + G.stage * 2;
  G.scroll += speed * dt;
  G.inv = Math.max(0, G.inv - dt);
  G.shake = Math.max(0, G.shake - dt);
  G.power = Math.max(0, G.power - dt);
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;
  if (G.fade) {   // fade out, swap the scenery and the song while it's dark, fade back in
    const was = G.fade.t;
    G.fade.t += dt;
    if (was < 0.6 && G.fade.t >= 0.6) switchLevel(G.fade.to);
    if (G.fade.t >= 1.2) G.fade = null;
  }

  // player
  if (G.demo) {
    G.px = W / 2 + Math.sin(G.t * 0.7) * 40;
    G.py = H * 0.74 + Math.sin(G.t * 1.3) * 6;
  } else {
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    G.px += kx * 110 * dt; G.py += ky * 110 * dt;
    G.px = clamp(G.px, 10, W - 10); G.py = clamp(G.py, 36, H - 16);
  }
  G.step += dt * 6;

  // shooting: hearts start slow so you can see them, and speed up every stage
  const hv = Math.min(100 + (G.stage - 1) * 22, 240);
  G.fireT -= dt;
  if (G.fireT <= 0) {
    G.fireT = Math.max(0.12, 0.26 - (G.stage - 1) * 0.025);
    addHeart({ x: G.px, y: G.py - 22, vx: 0, vy: -hv, own: true });
    if (G.power > 0) {
      addHeart({ x: G.px - 5, y: G.py - 20, vx: -hv * 0.27, vy: -hv * 0.95, own: true });
      addHeart({ x: G.px + 5, y: G.py - 20, vx: hv * 0.27, vy: -hv * 0.95, own: true });
    }
    if (!G.demo) SFX.shoot();
  }
  const reserve = Math.max(0, G.squad.length - SLOTS.length);
  const slow = Math.max(1, Math.sqrt(reserve));   // the ranks fire less often each as they grow, so a huge army stays fair
  G.maxArmy = Math.max(G.maxArmy, G.squad.length);
  G.squad.forEach((m, i) => {
    const [tx, ty] = slotPos(i);
    const k = 1 - Math.exp(-8 * dt);
    m.x += (tx - m.x) * k; m.y += (ty - m.y) * k;
    m.step += dt * 6;
    m.fireT -= dt;
    if (m.fireT <= 0) {
      const gap = Math.max(0.35, 0.7 - (G.stage - 1) * 0.06);
      m.fireT = (G.power > 0 ? gap / 2 : gap) * (i < SLOTS.length ? 1 : slow * rnd(0.8, 1.2));
      addHeart({ x: m.x, y: m.y - 22, vx: 0, vy: -hv, kind: m.kind });
    }
  });

  for (const h of G.hearts) { h.x += h.vx * dt; h.y += h.vy * dt; }
  G.hearts = G.hearts.filter((h) => h.y > -12 && h.x > -10 && h.x < W + 10 && !h.dead);

  // scenery
  for (const d of G.deco) d.y += speed * dt;
  G.deco = G.deco.filter((d) => d.y < H + 30);
  if (LEVELS[G.level].scroll) LEVELS[G.level].scroll(speed * dt);
  G.decoT -= dt;
  if (G.decoT <= 0) { G.decoT = rnd(0.25, 0.7); addDeco(-12); }

  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.t -= dt; }
  G.parts = G.parts.filter((p) => p.t > 0);
  for (const p of G.pops) { p.y -= 18 * dt; p.t -= dt; }
  G.pops = G.pops.filter((p) => p.t > 0);

  if (G.demo) return;

  // director
  G.stageT += dt;
  G.spawnT -= dt * (G.bossOut ? 0.45 : 1);
  if (G.spawnT <= 0) {
    // a bigger army brings out more of the mouse army, so there's always plenty to love
    const army = G.squad.length;
    G.spawnT = Math.max(0.38, 1.5 - G.stage * 0.14) * rnd(0.7, 1.3) / (1 + army / 25);
    if (G.enemies.length < 30 + army / 2) spawnEnemy();
  }
  G.cageT -= dt;
  if (G.cageT <= 0) {
    G.cageT = rnd(3.5, 5.5);
    // most cages hold one Moe; now and then a bigger one turns up with a few inside
    const n = G.stage >= 2 && Math.random() < 0.15 ? 2 + Math.floor(rnd(0, Math.min(G.stage, 4))) : 1;
    G.cages.push({ x: rnd(18, W - 18), y: -16, hp: 6 + n, t: 0, shake: 0, n });
  }
  if (!G.bossOut && G.stageT > 30) {
    G.bossOut = true;
    const n = G.stage >= 6 ? 3 : G.stage >= 3 ? 2 : 1;
    for (let i = 0; i < n; i++) G.enemies.push(tank(W / 2 + (i - (n - 1) / 2) * 50));
    banner(n > 1 ? "MOUSE TANKS!" : "MOUSE TANK!", "LOVE IT TO PIECES");
  }
  if (G.bossOut && !G.enemies.some((e) => e.type === "tank" && !e.loved)) {
    G.bossOut = false; G.stageT = 0; G.stage++;
    G.score += 500 * (G.stage - 1);
    const next = G.campaign && LEVELS.campaign.order[Math.floor((G.stage - 1) / CAMPAIGN_EVERY)];
    if (next && next !== G.level) G.fade = { t: 0, to: next };   // march on to the next level
    else banner("STAGE " + G.stage, "+" + 500 * (G.stage - 1) + " BONUS");
    reachStage(G.stage);
    if (G.stage >= 3 && !G.wasHit) award("socks");
    if (G.stage >= 11) award("crayon");
    if (G.score >= 50000) award("egg");
  }

  // enemies
  const bspeed = 70 + G.stage * 6;
  for (const e of G.enemies) {
    e.flash = Math.max(0, e.flash - dt);
    if (e.loved) {
      e.lt += dt;
      if (e.type === "gloom") { e.y -= 30 * dt; }
      else if (e.type === "mouse") { e.x += e.dir * 55 * dt; e.y += speed * dt; e.step += dt * 10; }
      else { e.y += 45 * dt; e.tread += dt * 20; }
      continue;
    }
    if (e.type === "gloom") {
      e.y += (speed + 14 + G.stage * 2) * dt;
      e.x += Math.sin(G.t * 2 + e.ph) * 22 * dt;
      e.shootT -= dt;
      if (e.shootT <= 0 && e.y > 0 && e.y < H * 0.6) {
        e.shootT = rnd(2.5, 4.5) / Math.min(1 + G.stage * 0.15, 2);
        G.ebul.push({ type: "drop", x: e.x, y: e.y + 6, vx: 0, vy: bspeed * 0.9, w: 3, h: 4 });
      }
    } else if (e.type === "mouse") {
      const slow = e.brute ? 0.55 : 1;
      if (e.wait <= 0 && e.y < e.stopY && e.shots === 0) {
        e.y += (28 + G.stage * 3) * slow * dt; e.step += dt * 8 * slow;
        if (e.y >= e.stopY) e.wait = e.brute ? 2.6 : 1.2;
      } else if (e.wait > 0) {
        e.wait -= dt; e.shootT -= dt;
        if (e.shootT <= 0) {
          e.shootT = e.brute ? 0.8 : 0.55; e.shots++;
          const a = Math.atan2(G.py - e.y, G.px - e.x);
          for (const da of e.brute ? [-0.3, 0, 0.3] : [0])
            G.ebul.push({ type: "frown", x: e.x, y: e.y + 6, vx: Math.cos(a + da) * bspeed, vy: Math.sin(a + da) * bspeed, w: 6, h: 5 });
        }
      } else {
        e.y += (40 + G.stage * 3) * (e.brute ? 0.6 : 1) * dt; e.step += dt * 10;
      }
    } else if (e.type === "tank") {
      e.tread += dt * 10;
      if (e.y < 52) e.y += 25 * dt;
      else {
        e.x += Math.cos(G.t * 0.7 + e.ph) * 35 * dt;
        e.x = clamp(e.x, 16, W - 16);
        e.shootT -= dt;
        if (e.shootT <= 0) {
          e.volley++;
          e.shootT = Math.max(0.9, 1.8 - G.stage * 0.1);
          if (G.stage >= 2 && e.volley % 4 === 0) {
            for (let i = 0; i < 10; i++) {
              const a = (i / 10) * Math.PI * 2 + G.t;
              G.ebul.push({ type: "frown", x: e.x, y: e.y + 4, vx: Math.cos(a) * bspeed * 0.7, vy: Math.sin(a) * bspeed * 0.7, w: 6, h: 5 });
            }
          } else {
            const a0 = Math.atan2(G.py - e.y, G.px - e.x);
            for (let i = -1; i <= 1; i++) {
              const a = a0 + i * 0.3;
              G.ebul.push({ type: "frown", x: e.x, y: e.y + 12, vx: Math.cos(a) * bspeed, vy: Math.sin(a) * bspeed, w: 6, h: 5 });
            }
          }
        }
      }
    }
  }
  G.enemies = G.enemies.filter((e) =>
    e.y < H + 24 && e.y > -60 && e.x > -30 && e.x < W + 30 && !(e.loved && e.lt > 3));

  for (const c of G.cages) { c.y += speed * dt; c.t += dt; c.shake = Math.max(0, c.shake - dt); }
  G.cages = G.cages.filter((c) => c.y < H + 16 && !c.dead);

  for (const b of G.ebul) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const p of G.pickups) { p.y += (speed + 10) * dt; p.t += dt; }

  // hearts hit things
  for (const h of G.hearts) {
    for (const e of G.enemies) {
      if (e.loved || e.y < -4 || (h.hits && h.hits.includes(e))) continue;
      const hs = h.blue ? 10 : 7;
      if (hit(h, h.x, h.y, hs, hs, e, e.x, e.y, e.w * 0.9, e.h * 0.9)) {
        if (h.pierce && --h.pierce > 0) h.hits.push(e); else h.dead = true;
        if (h.hits && e.type === "mouse" && (h.mHits = (h.mHits || 0) + 1) >= 3) award("rainbow");
        e.hp -= h.dmg || 1; e.flash = 0.06;
        dots(h.x, h.y - 2, 2, "#ffd42a");
        if (e.hp <= 0) loveEnemy(e); else if (e.type === "tank" || e.brute) SFX.hit();
        break;
      }
    }
    if (h.dead) continue;
    for (const c of G.cages) {
      if (hit(h, h.x, h.y, 7, 7, c, c.x, c.y, 28, 28)) {
        h.dead = true; c.hp -= h.dmg || 1; c.shake = 0.12;
        dots(h.x, h.y, 2, "#8a5a2b");
        if (c.hp <= 0 && !c.dead) {
          c.dead = true;
          dots(c.x, c.y, 20, "#8a5a2b");
          burst(c.x, c.y, 5, SMALL_HEART, 50);
          for (let k = 0; k < c.n; k++) freeMoe(c.x + rnd(-8, 8), c.y + rnd(-6, 6));
          award("key");
          if (G.squad.length >= SLOTS.length) award("whistle");
          if (G.squad.length >= armyMax()) award("flag");
          G.rescued += c.n; G.score += 250 * c.n; freeMoesTotal(c.n);
          pop(c.x, c.y - 18, "+" + c.n + (c.n > 1 ? " MOES!" : " MOE!"), "#ff9fca");
          SFX.free();
        }
        break;
      }
    }
  }
  G.hearts = G.hearts.filter((h) => !h.dead);

  // things hit you
  for (const b of G.ebul) {
    if (hit(b, b.x, b.y, b.w * 0.7, b.h * 0.7, null, G.px, G.py - 2, 10, 16)) {
      b.dead = true; hurtPlayer(); continue;
    }
    for (let i = 0; i < G.squad.length; i++) {
      const m = G.squad[i];
      if (hit(b, b.x, b.y, b.w * 0.7, b.h * 0.7, m, m.x, m.y - 2, 10, 16)) {
        b.dead = true;
        if (G.guard) { dots(m.x, m.y - 8, 6, "#ffd23f"); pop(m.x, m.y - 24, "SAFE", "#ffd23f"); break; }
        // half the shots bounce off your V, and the back ranks stand shoulder to shoulder so most bounce off them
        if (Math.random() < (i >= SLOTS.length ? 0.88 : 0.5)) { dots(m.x, m.y - 8, 3, "#fff"); break; }
        G.squad.splice(i, 1);
        dots(m.x, m.y, 10, "#fff");
        pop(m.x, m.y - 24, "AWW", "#c4cde8");
        SFX.lose();
        break;
      }
    }
  }
  G.ebul = G.ebul.filter((b) => !b.dead && b.y < H + 10 && b.y > -20 && b.x > -10 && b.x < W + 10);
  for (const e of G.enemies) {
    if (!e.loved && hit(e, e.x, e.y, e.w * 0.7, e.h * 0.7, null, G.px, G.py - 2, 10, 16)) hurtPlayer();
  }
  for (const p of G.pickups) {
    if (hit(p, p.x, p.y, 12, 12, null, G.px, G.py - 2, 16, 24)) {
      p.dead = true;
      if (p.type === "power") { G.power = 10; SFX.power(); if (++G.overloads >= 3) award("battery"); banner("LOVE OVERLOAD!", "TRIPLE HEARTS", 1.8); }
      else { G.lives = Math.min(5, G.lives + 1); SFX.free(); pop(p.x, p.y - 10, "+1 LIFE", "#ff9fca"); }
    }
  }
  G.pickups = G.pickups.filter((p) => !p.dead && p.y < H + 12);
  updateMeowers(dt, 20 + G.stage * 2);
}

// ---------- draw ----------
function text(s, x, y, col, align) {
  ctx.textAlign = align || "left";
  ctx.fillStyle = "#14121a"; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col || "#fff"; ctx.fillText(s, x, y);
}

function draw() {
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (!G) return;
  if (G.shake > 0) ctx.translate(Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2)));

  // ground
  const LV = LEVELS[G.level];
  if (LV.tile) {
    const th = LV.tile.height, off = Math.floor(G.scroll) % th;
    for (let y = -th + off; y < H; y += th) ctx.drawImage(LV.tile, 0, y);
    G.deco.forEach(LV.drawDeco);
    LV.under();
    LV.light();
  } else {
    const off = Math.floor(G.scroll) % 32;
    for (let y = -32 + off; y < H; y += 32) for (let x = 0; x < W; x += 32) ctx.drawImage(TILE, x, y);
    G.deco.forEach(drawDeco);
  }

  G.cages.forEach(drawCage);
  G.meows.forEach(drawMeower);
  for (const p of G.pickups) {
    const img = p.type === "power" ? BRADLEY : LIFE;
    const bob = Math.round(Math.sin(p.t * 6) * 1.5);
    if (p.type === "power" && Math.floor(p.t * 8) % 2) {
      ctx.fillStyle = "#fff"; ctx.fillRect(Math.round(p.x) - 8, Math.round(p.y) - 7 + bob, 1, 1);
      ctx.fillRect(Math.round(p.x) + 7, Math.round(p.y) + 4 + bob, 1, 1);
    }
    ctx.drawImage(img, Math.round(p.x - img.width / 2), Math.round(p.y - img.height / 2) + bob);
  }

  // enemies, loved ones first so the angry ones sit on top
  const order = G.enemies.slice().sort((a, b) => (a.loved ? 0 : 1) - (b.loved ? 0 : 1));
  for (const e of order) {
    const fl = e.flash > 0;
    if (e.type === "tank") { drawTank(e, fl); continue; }
    if (e.type === "mouse") {
      drawMouse(e, fl);
      if (e.loved && Math.floor(e.lt * 4) % 2 === 0) ctx.drawImage(PINK_HEART, Math.round(e.x - 2), Math.round(e.y - 26));
      continue;
    }
    const img = e.loved ? HAPPY_CLOUD : fl ? GLOOM_W : GLOOM;
    if (e.loved) ctx.globalAlpha = clamp(1 - e.lt / 2.5, 0, 1);
    ctx.drawImage(img, Math.round(e.x - img.width / 2), Math.round(e.y - img.height / 2));
    ctx.globalAlpha = 1;
  }

  // tank and brute health bars
  for (const e of G.enemies) {
    if ((e.type !== "tank" && !e.brute) || e.loved) continue;
    if (e.brute && e.hp >= e.maxhp) continue;
    const x = Math.round(e.x - 12), y = Math.round(e.y - (e.brute ? 25 : 19));
    ctx.fillStyle = "#14121a"; ctx.fillRect(x - 1, y - 1, 26, 4);
    ctx.fillStyle = "#585c69"; ctx.fillRect(x, y, 24, 2);
    ctx.fillStyle = "#ff7eb6"; ctx.fillRect(x, y, Math.round(24 * (1 - e.hp / e.maxhp)), 2);
  }

  // squad, then you
  for (const m of G.squad.slice().sort((a, b) => a.y - b.y)) drawMoe(m.x, m.y, Math.floor(m.step), 0, m.kind);
  if (!(G.inv > 0 && Math.floor(G.inv * 12) % 2 === 0)) {
    drawGlow(G.px, G.py, G.t);
    drawMoe(G.px, G.py, Math.floor(G.step), G.power > 0 && Math.floor(G.t * 10) % 2 ? 0.35 : 0, player().head);
  }

  for (const h of G.hearts) {
    if (h.blue) { ctx.drawImage(BIG_BLUE_HEART, Math.round(h.x - 5), Math.round(h.y - 5)); continue; }
    if (h.c == null) { ctx.drawImage(HEART, Math.round(h.x - 4), Math.round(h.y - 4)); continue; }
    ctx.fillStyle = CRAYON_COLS[h.c][0];   // a wiggly crayon scribble behind the heart
    for (let k = 1; k <= 4; k++) {
      ctx.globalAlpha = 0.5 - k * 0.1;
      ctx.fillRect(Math.round(h.x - h.vx * k * 0.025 + Math.sin(h.y * 0.3 + k) * 1.5), Math.round(h.y + 4 + k * 2), 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(CRAYON_HEARTS[h.c], Math.round(h.x - 4), Math.round(h.y - 4));
  }
  for (const b of G.ebul) {
    const img = b.type === "drop" ? DROP : FROWN;
    ctx.drawImage(img, Math.round(b.x - img.width / 2), Math.round(b.y - img.height / 2));
  }
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.t * 2, 0, 1);
    if (p.img) ctx.drawImage(p.img, Math.round(p.x - 2), Math.round(p.y - 2));
    else { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  }
  ctx.globalAlpha = 1;

  ctx.font = '8px "Press Start 2P"';
  ctx.textBaseline = "top";
  for (const p of G.pops) {
    ctx.globalAlpha = clamp(p.t * 2, 0, 1);
    text(p.text, Math.round(p.x), Math.round(p.y), p.col, "center");
  }
  ctx.globalAlpha = 1;

  if (G.fade) {
    ctx.fillStyle = "rgba(10,8,16," + clamp(1 - Math.abs(G.fade.t - 0.6) / 0.6, 0, 1) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (G.demo) return;

  // HUD
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.fillStyle = "#14121acc"; ctx.fillRect(0, 0, W, 13);
  text(String(G.score).padStart(6, "0"), 3, 3, "#ffd42a");
  for (let i = 0; i < G.lives; i++) ctx.drawImage(PINK_HEART, W - 8 - i * 7, 4);
  ctx.drawImage(SMALL_HEART, 58, 4);
  text("x" + G.squad.length, 64, 3, "#ff9fca");
  text("S" + G.stage, 104, 3, "#e9f2d0");
  if (G.power > 0) {
    ctx.fillStyle = "#ffd42a"; ctx.fillRect(0, 13, Math.round(W * G.power / 10), 1);
  }

  if (G.banner) {
    const b = G.banner;
    ctx.globalAlpha = clamp(b.t * 2, 0, 1);
    ctx.fillStyle = "#14121a99"; ctx.fillRect(0, H * 0.36 - 6, W, b.b ? 34 : 20);
    text(b.a, W / 2, Math.round(H * 0.36), "#ffd42a", "center");
    if (b.b) text(b.b, W / 2, Math.round(H * 0.36) + 14, "#fff", "center");
    ctx.globalAlpha = 1;
  }
}

// a gold glow under your feet, so you stand out from the squad
function drawGlow(x, y, t) {
  ctx.fillStyle = "rgba(255, 212, 42, " + (0.3 + Math.sin(t * 5) * 0.1) + ")";
  ctx.beginPath(); ctx.ellipse(x, y + 15, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255, 212, 42, " + (0.75 + Math.sin(t * 5) * 0.2) + ")";
  ctx.beginPath(); ctx.ellipse(x, y + 15, 11, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255, 250, 215, 0.85)";
  ctx.beginPath(); ctx.ellipse(x, y + 15, 6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- screens ----------
function show(id) {
  ["title", "over", "pause", "editor", "trophies"].forEach((s) => $(s).classList.toggle("on", s === id));
}
function startGame() {
  audio();
  newGame(false);
  G.guard = !!player().guard;
  G.crayon = !!player().crayon;
  G.blue = !!player().blue;
  startMusic(LEVELS[G.level].song);
  state = "play"; paused = false;
  show(null);
  if (LEVELS[G.level].banner) banner(...LEVELS[G.level].banner);
  else banner("STAGE 1", "LOVE THEM ALL");
}
function toTitle() {
  stopMusic();
  newGame(true);
  state = "title";
  const best = +(store.get(BEST_KEY) || 0);
  $("bestTitle").innerHTML = best ? "BEST <b>" + best + "</b>" : "";
  viewId = player().id;
  renderPicker();
  show("title");
}

function renderPicker() {
  const list = available();
  const p = list.find((q) => q.id === viewId) || player();
  const locked = !unlocked(p);
  const prog = !locked ? "" : p.unlock.mice ? " (" + Math.min(miceTotal(), p.unlock.mice) + "/" + p.unlock.mice + ")"
    : p.unlock.freed ? " (" + Math.min(freedTotal(), p.unlock.freed) + "/" + p.unlock.freed + ")"
    : bestStage() ? " (BEST " + bestStage() + ")" : "";
  $("pName").innerHTML = p.name + (p.id === "custom" ? customNote : "") + (locked ? "<br><b>LOCKED: " + p.unlock.text + prog + "</b>" : "") +
    (p.perk ? "<br>PERK: " + p.perk : "");
  $("enlistBtn").textContent = CUSTOM ? "NEW PICTURE" : "ENLIST YOUR MOE";
  const c = $("pCv").getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, 144, 176);
  const big = p.head === "bluu";   // big heads get drawn a bit smaller so they fit
  c.setTransform(big ? 3 : 4, 0, 0, big ? 3 : 4, 0, 0);
  c.imageSmoothingEnabled = false;
  const main = ctx;
  ctx = c;
  const px = big ? 24 : 18, py = big ? 36 : 23;
  if (!locked) drawGlow(px, py, 0);
  drawMoe(px, py, 0, 0, p.head);
  ctx = main;
  if (locked) {   // a dark shape, like a character select you haven't earned yet
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = "source-atop";
    c.fillStyle = "rgba(20, 18, 26, 0.93)";
    c.fillRect(0, 0, 144, 176);
    c.globalCompositeOperation = "source-over";
  }
}
function cyclePlayer(d) {
  const list = available();
  const i = Math.max(0, list.findIndex((p) => p.id === viewId));
  const next = list[(i + d + list.length) % list.length];
  viewId = next.id;
  if (unlocked(next)) { playerId = next.id; store.set(PLAYER_KEY, playerId); }
  renderPicker();
}

// ---------- the "enlist your Moe" editor ----------
// Step 1 (frame): drag and zoom your picture so the head fills the frame, chin on the collar.
// Step 2 (erase): tap the background to erase it, drag to rub out bits, or AUTO ERASE.
const edCv = $("edCv"), edx = edCv.getContext("2d");
const ED_H = 175;   // editor canvas height in frame pixels: the head frame plus a body underneath
const ed = { img: null, step: "frame", s: 1, base: 1, ox: 0, oy: 0, work: null, undo: [], ptr: null };

function edMsg(t) { $("edMsg").textContent = t || ""; }
$("enlistBtn").onclick = () => { $("edFile").value = ""; $("edFile").click(); };
$("edFile").onchange = () => {
  const f = $("edFile").files && $("edFile").files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => { ed.img = im; edFrame(true); show("editor"); };
  im.onerror = () => { $("pName").textContent = "CAN'T OPEN THAT PICTURE"; };
  im.src = URL.createObjectURL(f);
};

function edFrame(fresh) {
  ed.step = "frame";
  const iw = ed.img.naturalWidth, ih = ed.img.naturalHeight;
  if (fresh) {
    // a PFP's head is usually about 3/4 of the picture wide, in the top half
    ed.base = Math.min(HW / (0.85 * iw), HH / (0.7 * ih));
    $("edZoom").value = 50;
    ed.s = ed.base;
    ed.ox = HW / 2 - iw * 0.5 * ed.s;
    ed.oy = HH * 0.5 - ih * 0.4 * ed.s;
  }
  $("edHelp").innerHTML = "DRAG YOUR MOE AND ZOOM<br>SO THE HEAD FILLS THE BOX<br>AND THE CHIN SITS ON THE COLLAR";
  $("edZoom").style.display = ""; $("edTools").style.display = "none";
  $("edBack").textContent = "CANCEL"; $("edNext").textContent = "NEXT";
  edMsg(""); edDraw();
}
function edErase() {
  ed.step = "erase";
  ed.work = document.createElement("canvas");
  ed.work.width = HW; ed.work.height = HH;
  const w = ed.work.getContext("2d");
  w.imageSmoothingQuality = "high";
  w.drawImage(ed.img, ed.ox, ed.oy, ed.img.naturalWidth * ed.s, ed.img.naturalHeight * ed.s);
  ed.undo = [];
  $("edHelp").innerHTML = "TAP THE BACKGROUND TO ERASE IT<br>DRAG TO RUB OUT LITTLE BITS<br>(SEE-THROUGH PICTURES ARE READY)";
  $("edZoom").style.display = "none"; $("edTools").style.display = "";
  $("edBack").textContent = "BACK"; $("edNext").textContent = "DONE";
  edMsg(""); edDraw();
}
function edDraw() {
  edx.setTransform(1, 0, 0, 1, 0, 0);
  edx.clearRect(0, 0, edCv.width, edCv.height);
  edx.setTransform(edCv.width / HW, 0, 0, edCv.width / HW, 0, 0);
  // the uniform underneath, so you can see where the chin goes
  edx.imageSmoothingEnabled = false;
  edx.drawImage(BODY_F[0], HW / 2 - 40, HH - 5, 80, 60);
  edx.imageSmoothingEnabled = true;
  edx.imageSmoothingQuality = "high";
  if (ed.step === "frame") {
    edx.save();
    edx.beginPath(); edx.rect(0, 0, HW, HH); edx.clip();
    edx.drawImage(ed.img, ed.ox, ed.oy, ed.img.naturalWidth * ed.s, ed.img.naturalHeight * ed.s);
    edx.restore();
    // the standard soldier head, faintly, as a size guide
    if (photoReady()) {
      const h = 130 * HEAD_PHOTO.naturalHeight / HEAD_PHOTO.naturalWidth;
      edx.globalAlpha = 0.2;
      edx.drawImage(HEAD_PHOTO, 10, HH + 5 - h, 130, h);
      edx.globalAlpha = 1;
    }
    edx.strokeStyle = "#ffd42a"; edx.lineWidth = 1; edx.setLineDash([4, 3]);
    edx.strokeRect(0.5, 0.5, HW - 1, HH - 1);
    edx.setLineDash([]);
  } else {
    edx.drawImage(ed.work, 0, 0);
  }
}

function edPoint(e) {
  const r = edCv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * HW / r.width, y: (e.clientY - r.top) * ED_H / r.height };
}
edCv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const p = edPoint(e);
  ed.ptr = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
  try { edCv.setPointerCapture(e.pointerId); } catch (err) {}
  if (ed.step === "erase") edSnapshot();
});
edCv.addEventListener("pointermove", (e) => {
  const P = ed.ptr;
  if (!P || P.id !== e.pointerId) return;
  const p = edPoint(e);
  if (Math.hypot(p.x - P.sx, p.y - P.sy) > 2.5) P.moved = true;
  if (ed.step === "frame") {
    ed.ox += p.x - P.x; ed.oy += p.y - P.y;
    edDraw();
  } else if (P.moved) {
    const w = ed.work.getContext("2d");
    w.globalCompositeOperation = "destination-out";
    w.lineCap = "round"; w.lineWidth = 7;
    w.beginPath(); w.moveTo(P.x, P.y); w.lineTo(p.x, p.y); w.stroke();
    w.globalCompositeOperation = "source-over";
    edDraw();
  }
  P.x = p.x; P.y = p.y;
});
const edUp = (e) => {
  const P = ed.ptr;
  if (!P || P.id !== e.pointerId) return;
  ed.ptr = null;
  if (ed.step === "erase" && !P.moved && P.sy < HH) { edFlood([[Math.floor(P.sx), Math.floor(P.sy)]], 38); edDraw(); }
};
edCv.addEventListener("pointerup", edUp);
edCv.addEventListener("pointercancel", edUp);

$("edZoom").oninput = () => {
  // zoom around the middle of the frame
  const old = ed.s;
  ed.s = ed.base * Math.pow(2, ($("edZoom").value - 50) / 25);
  const cx = HW / 2, cy = HH / 2;
  ed.ox = cx - (cx - ed.ox) * ed.s / old;
  ed.oy = cy - (cy - ed.oy) * ed.s / old;
  edDraw();
};
function edSnapshot() {
  ed.undo.push(ed.work.getContext("2d").getImageData(0, 0, HW, HH));
  if (ed.undo.length > 25) ed.undo.shift();
}
$("edUndo").onclick = () => {
  if (!ed.undo.length) return;
  ed.work.getContext("2d").putImageData(ed.undo.pop(), 0, 0);
  edDraw();
};
$("edAuto").onclick = () => {
  edSnapshot();
  const seeds = [];
  for (let x = 0; x < HW; x += 2) { seeds.push([x, 0]); }
  for (let y = 0; y < HH; y += 2) { seeds.push([0, y]); seeds.push([HW - 1, y]); }
  edFlood(seeds, 30);
  edDraw();
  edMsg("ATE TOO MUCH? TAP UNDO");
};
// erase every pixel joined to the seeds that is close in colour to the seed it started from
function edFlood(seeds, tol) {
  const w = ed.work.getContext("2d");
  const id = w.getImageData(0, 0, HW, HH), d = id.data;
  const seen = new Uint8Array(HW * HH);
  const lim = tol * tol * 3;
  for (const [sx, sy] of seeds) {
    const s0 = (sy * HW + sx);
    if (sx < 0 || sy < 0 || sx >= HW || sy >= HH || seen[s0] || d[s0 * 4 + 3] === 0) continue;
    const r0 = d[s0 * 4], g0 = d[s0 * 4 + 1], b0 = d[s0 * 4 + 2];
    const stack = [s0];
    seen[s0] = 1;
    while (stack.length) {
      const i = stack.pop(), o = i * 4;
      const dr = d[o] - r0, dg = d[o + 1] - g0, db = d[o + 2] - b0;
      if (d[o + 3] !== 0 && dr * dr + dg * dg + db * db > lim) continue;
      d[o + 3] = 0;
      const x = i % HW, y = (i - x) / HW;
      if (x > 0 && !seen[i - 1]) { seen[i - 1] = 1; stack.push(i - 1); }
      if (x < HW - 1 && !seen[i + 1]) { seen[i + 1] = 1; stack.push(i + 1); }
      if (y > 0 && !seen[i - HW]) { seen[i - HW] = 1; stack.push(i - HW); }
      if (y < HH - 1 && !seen[i + HW]) { seen[i + HW] = 1; stack.push(i + HW); }
    }
  }
  w.putImageData(id, 0, 0);
}
$("edBack").onclick = () => { if (ed.step === "erase") edFrame(false); else toTitle(); };
$("edNext").onclick = () => {
  if (ed.step === "frame") { edErase(); return; }
  const url = ed.work.toDataURL("image/png");
  store.set(CUSTOM_KEY, url);
  award("photo");
  const kept = store.get(CUSTOM_KEY) === url;
  customNote = kept ? "" : " (THIS VISIT ONLY)";
  loadCustom(url);
  playerId = "custom";
  store.set(PLAYER_KEY, playerId);
  toTitle();
};
$("pPrev").onclick = () => cyclePlayer(-1);
// level picker: only shows on this Mac until the Strip is ready
function showLevel() { $("levelBtn").textContent = "LEVEL: " + LEVELS[levelId].name; }
if (LOCAL) { $("levelRow").style.display = ""; showLevel(); }
$("levelBtn").onclick = () => {
  const ids = Object.keys(LEVELS);
  levelId = ids[(ids.indexOf(levelId) + 1) % ids.length];
  store.set(LEVEL_KEY, levelId);
  showLevel();
  newGame(true);
};
$("pNext").onclick = () => cyclePlayer(1);
function showOver() {
  const best = +(store.get(BEST_KEY) || 0);
  $("overStats").innerHTML =
    "SCORE <b>" + G.score + "</b><br>" +
    "MICE LOVED <b>" + G.mice + "</b><br>" +
    "MOES FREED <b>" + G.rescued + "</b><br>" +
    (G.meowers ? "MEOWERS SAVED <b>" + G.meowers + "</b><br>" : "") +
    "BIGGEST ARMY <b>" + G.maxArmy + "</b><br>" +
    "STAGE <b>" + G.stage + "</b> · BEST <b>" + best + "</b>";
  $("rank").textContent = "";
  $("getMoe").style.display = SCATTER_URL ? "" : "none";
  show("over");
  const fill = () => { if (lb && state === "over") $("rank").textContent = lb.rankText(BOARD); };
  setTimeout(fill, 1500); setTimeout(fill, 4000);
}
function share() {
  const msg = "I led an army of " + G.maxArmy + " Moes, won over " + G.mice + " of the Anti Moemoe mouse army with love and scored " + G.score +
    " in MOEMOE ARMY 💛\nmoemoe means ily. Enlist:";
  window.open("https://x.com/intent/post?text=" + encodeURIComponent(msg) + "&url=" + encodeURIComponent(SITE_URL),
    "_blank", "noopener");
  award("megaphone");
}

function setPaused(p) {
  if (state !== "play") return;
  paused = p;
  show(p ? "pause" : null);
  if (p) stopMusic(); else resumeMusic();
}

// ---------- input ----------
let drag = null;
const busy = () => lb && lb.isOpen();
stageEl.addEventListener("pointerdown", (e) => {
  if (busy() || e.target.tagName === "BUTTON" || e.target.closest(".noStart")) return;
  audio();
  if (state === "title") { startGame(); return; }
  if (state === "play" && paused) { setPaused(false); return; }
  if (state === "play") {
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
stageEl.addEventListener("pointermove", (e) => {
  if (!drag || drag.id !== e.pointerId || state !== "play" || paused) return;
  const k = 1.25 / SCALE;
  G.px = clamp(G.px + (e.clientX - drag.x) * k, 10, W - 10);
  G.py = clamp(G.py + (e.clientY - drag.y) * k, 36, H - 16);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
stageEl.addEventListener("pointerup", endDrag);
stageEl.addEventListener("pointercancel", endDrag);

window.addEventListener("keydown", (e) => {
  if (busy()) return;
  keys[e.code] = true;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
  if ((e.code === "Enter" || e.code === "Space") && state === "title" && $("title").classList.contains("on")) startGame();
  else if ((e.code === "Enter" || e.code === "Space") && state === "over" && overTimer <= 0 && $("over").classList.contains("on")) startGame();
  else if ((e.code === "KeyP" || e.code === "Escape") && state === "play") setPaused(!paused);
  else if (e.code === "KeyL" && state !== "play" && lb) lb.open(BOARD);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; setPaused(true); });
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

$("again").onclick = () => startGame();
$("menuOver").onclick = () => toTitle();
$("menuPause").onclick = () => { paused = false; toTitle(); };
$("share").onclick = share;
$("lbTitle").onclick = () => lb && lb.open(BOARD);
$("lbOver").onclick = () => lb && lb.open(BOARD);
$("getMoe").onclick = () => { if (SCATTER_URL) { window.open(SCATTER_URL, "_blank", "noopener"); award("bag"); } };
$("troTitle").onclick = () => openTrophies("title");
$("troOver").onclick = () => openTrophies("over");
$("troBack").onclick = () => show(trophyFrom);
$("mute").onclick = () => { audio(); setMute(!muted); };
loadCustom(store.get(CUSTOM_KEY));
setMute(muted);


// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === "play" && !paused) update(dt);
  else if (state === "title") update(dt);
  else if (state === "over") {
    // the world keeps drifting behind the results
    G.scroll += 12 * dt;
    for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.t -= dt; }
    G.parts = G.parts.filter((p) => p.t > 0);
    for (const p of G.pops) { p.y -= 18 * dt; p.t -= dt; }
    G.pops = G.pops.filter((p) => p.t > 0);
    if (overTimer > 0 && (overTimer -= dt) <= 0) showOver();
  }
  draw();
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
resize();
toTitle();
(document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve()).catch(() => {}).then(() => {});
requestAnimationFrame(frame);

// for testing: ?debug exposes the game
if (/[?&]debug\b/.test(location.search)) window.__army = {
  get G() { return G; }, startGame, get state() { return state; }, MUSIC, SONGS, buildSong,
  run(sec) { for (let i = 0; i < sec * 60 && state === "play"; i++) update(1 / 60); },   // play on without a screen
};
})();
</script>
